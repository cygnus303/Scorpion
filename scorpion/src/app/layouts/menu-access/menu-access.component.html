<div class="input-background-color" style="padding:0;gap:0; background-color: #f3f4f6;">
  <div class="p-3">

    <!-- Red Theme Header -->
    <div class="d-flex justify-content-between align-items-center p-3 rounded-top" style="background-color: #b91c1c; color: white;">
      <div class="d-flex align-items-center gap-3">
        <span class="fw-bold fs-6 text-uppercase" style="border-bottom: 2px solid white; padding-bottom: 2px;">
          Menu Access
        </span>
      </div>
    </div>

    <!-- Main Content Panel -->
    <div class="table-panel p-4 bg-white border border-top-0 rounded-bottom shadow-sm">
      
      <!-- Control Bar -->
      <div class="control-bar d-block gap-2 mb-4 pb-4 border-bottom">
        <div class="row g-3 align-items-end">
          <!-- Search -->
          <div class="col-lg-3">
            <label class="form-label fw-bold text-muted small text-uppercase" style="letter-spacing: 0.5px;">
              Search Module
            </label>
            <input type="text" class="form-control" placeholder="Search module..." [(ngModel)]="searchText">
          </div>
    
          <!-- Search Type -->
          <div class="col-lg-3">
            <label class="form-label fw-bold text-muted small text-uppercase" style="letter-spacing: 0.5px;">
              Search Type
            </label>
            <ng-select [(ngModel)]="searchType" class="noFoundTextColor remove-select-color" [clearable]="false" (change)="onSearchTypeChange()">
              <ng-option value="User">User</ng-option>
              <ng-option value="Role">Role</ng-option>
            </ng-select>
          </div>
    
          <!-- Role -->
          <div class="col-lg-3" *ngIf="searchType === 'Role'">
            <label class="form-label fw-bold text-muted small text-uppercase" style="letter-spacing: 0.5px;">
              Select Role
            </label>
            <ng-select [(ngModel)]="roleType" class="noFoundTextColor remove-select-color" [items]="generalMasterService.roleTypeList" bindLabel="codeDesc" bindValue="codeId" (change)="fetchUserMenus()">
            </ng-select>
          </div>
    
          <!-- User -->
          <div class="col-lg-3" *ngIf="searchType === 'User'">
            <label class="form-label fw-bold text-muted small text-uppercase" style="letter-spacing: 0.5px;">
              Select User
            </label>
            <ng-select [(ngModel)]="selectedUserId" class="noFoundTextColor remove-select-color" (change)="fetchUserMenus()">
              <ng-option *ngFor="let data of LoadingSheetService.unLoaderUserList" [value]="data.userId">
                {{data.userId}} - {{data.name}}
              </ng-option>
            </ng-select>
          </div>
    
          <!-- Button -->
          <div class="col-lg-3 text-end ms-auto">
            <button class="btn btn-primary px-4 py-2 fw-bold" style="background-color: #0d6efd; border: none;" (click)="onSubmit()">
              <i class="ri-check-line me-1"></i> Apply Access
            </button>
          </div>
        </div>
      </div>

      <!-- Table Layout -->
      <div class="table-wrap mt-2">
        <table class="table align-middle data-table mb-0">
          <thead>
            <tr>
              <th class="text-start align-middle" style="width: 300px;">
                <span class="text-uppercase">Module Name</span>
              </th>
              <th class="text-center" style="width: 100px;">
                <div class="d-flex flex-column align-items-center">
                  <span class="text-uppercase mb-1 fw-bold small">ALL</span>
                  <input class="form-check-input m-0" type="checkbox" style="cursor: pointer;"
                    [checked]="isAllSelected()" (change)="toggleAll($event)">
                </div>
              </th>
              <th class="text-center" *ngFor="let col of permissionColumns">
                <div class="d-flex flex-column align-items-center">
                  <span class="text-uppercase mb-1">{{col.action}}</span>
                  <input class="form-check-input m-0" type="checkbox" style="cursor: pointer;"
                    [checked]="isColumnAllSelected(col)" (change)="toggleColumn(col, $event)">
                </div>
              </th>
            </tr>
          </thead>
          <tbody *ngIf="filteredPermissionsList.length === 0">
            <tr>
              <td [attr.colspan]="permissionColumns.length + 2" class="text-center py-4 text-muted fs-5">
                No modules found.
              </td>
            </tr>
          </tbody>
          <tbody *ngIf="filteredPermissionsList.length > 0">
            <tr *ngFor="let module of filteredPermissionsList">
              <td class="text-start">
                <span class="fw-bold text-dark">{{module.displayName}}</span>
              </td>
              <td class="text-center">
                <input *ngIf="module.permissions && module.permissions.length > 0" class="form-check-input m-0" type="checkbox" style="cursor: pointer; transform: scale(1.2);"
                  [checked]="isRowSelected(module)" (change)="toggleRow(module, $event)">
              </td>
              <td class="text-center" *ngFor="let col of permissionColumns">
                <input class="form-check-input m-0" type="checkbox" style="cursor: pointer; transform: scale(1.2);"
                  *ngIf="getPermission(module, col) as perm" [(ngModel)]="perm.isUSERACCESS">
                <span *ngIf="!getPermission(module, col)" class="text-muted">-</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
