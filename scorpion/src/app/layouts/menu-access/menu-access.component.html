<div class="input-background-color" style="padding:0;gap:0; background-color: #f3f4f6;">
  <div class="p-3">

    <!-- Red Theme Header -->
    <div class="d-flex justify-content-between align-items-center p-3 rounded-top" style="background-color: #b91c1c; color: white;">
      <div class="d-flex align-items-center gap-3">
        <span class="fw-bold fs-6 text-uppercase" style="border-bottom: 2px solid white; padding-bottom: 2px;">
          Menu Access
        </span>
      </div>
    </div>

    <!-- Main Content Panel -->
    <div class="table-panel p-4 bg-white border border-top-0 rounded-bottom shadow-sm">
      
      <!-- Control Bar -->
      <div class="control-bar d-block gap-2 mb-4 pb-4 border-bottom">
        <div class="row g-3 align-items-end">
          <!-- Search -->
          <div class="col-lg-3">
            <label class="form-label fw-bold text-muted small text-uppercase" style="letter-spacing: 0.5px;">
              Search Module
            </label>
            <input type="text" class="form-control" placeholder="Search module..." [(ngModel)]="searchText">
          </div>
    
          <!-- Search Type -->
          <div class="col-lg-3">
            <label class="form-label fw-bold text-muted small text-uppercase" style="letter-spacing: 0.5px;">
              Search Type
            </label>
            <ng-select [(ngModel)]="searchType" class="noFoundTextColor remove-select-color" [clearable]="false" (change)="onSearchTypeChange()">
              <ng-option value="User">User</ng-option>
              <ng-option value="Role">Role</ng-option>
            </ng-select>
          </div>
    
          <!-- Role -->
          <div class="col-lg-3" *ngIf="searchType === 'Role'">
            <label class="form-label fw-bold text-muted small text-uppercase" style="letter-spacing: 0.5px;">
              Select Role
            </label>
            <ng-select [(ngModel)]="roleType" class="noFoundTextColor remove-select-color" [items]="generalMasterService.roleTypeList" bindLabel="codeDesc" bindValue="codeId" (change)="fetchUserMenus()">
            </ng-select>
          </div>
    
          <!-- User -->
          <div class="col-lg-3" *ngIf="searchType === 'User'">
            <label class="form-label fw-bold text-muted small text-uppercase" style="letter-spacing: 0.5px;">
              Select User
            </label>
            <ng-select [(ngModel)]="selectedUserId" class="noFoundTextColor remove-select-color" (change)="fetchUserMenus()">
              <ng-option *ngFor="let data of LoadingSheetService.unLoaderUserList" [value]="data.userId">
                {{data.userId}} - {{data.name}}
              </ng-option>
            </ng-select>
          </div>
    
          <!-- Button -->
          <div class="col-lg-3 text-end ms-auto">
            <button class="btn btn-primary px-4 py-2 fw-bold" style="background-color: #0d6efd; border: none;" (click)="onSubmit()">
              <i class="ri-check-line me-1"></i> Apply Access
            </button>
          </div>
        </div>
      </div>

      <!-- Master-Detail Layout -->
      <div class="row layout-container mt-2 border rounded bg-white shadow-sm overflow-hidden">
        
        <!-- Master Sidebar -->
        <div class="col-md-4 module-sidebar border-end p-0 bg-white d-flex flex-column">
          <!-- Dark Grey Sub-Header -->
          <div class="p-2 d-flex justify-content-between align-items-center"
            style="background-color: #4b5563; color: white;">
            <span class="fw-bold text-uppercase small" style="letter-spacing: 0.5px;">
              <i class="fas fa-circle text-danger me-2" style="font-size: 10px;"></i> ALL MODULES
            </span>
            <div class="form-check d-flex align-items-center m-0 me-2">
              <input class="form-check-input m-0" type="checkbox" id="selectAllGlobal"
                style="cursor: pointer; transform: scale(1.1);" [checked]="isAllSelected()"
                (change)="toggleAll($event)">
              <label class="form-check-label fw-bold ms-2 small" for="selectAllGlobal"
                style="cursor: pointer;">Select All</label>
            </div>
          </div>

          <div class="list-group list-group-flush module-list flex-grow-1" style="max-height: 540px; overflow-y: auto;">
            <button *ngFor="let module of filteredPermissionsList" type="button"
              class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3 border-bottom"
              [class.active-module]="selectedModule === module" (click)="selectModule(module)">
              <div class="d-flex align-items-center">
                <input type="checkbox" class="form-check-input me-3 mt-0" style="transform: scale(1.1);"
                  [checked]="isRowSelected(module)" (change)="toggleRow(module, $event)"
                  (click)="$event.stopPropagation()">
                <!-- Red highlight for active module text -->
                <span class="fw-bold" [style.color]="selectedModule === module ? '#b91c1c' : '#374151'">{{module.displayName}}</span>
              </div>
              <i class="fas fa-chevron-right small" [style.color]="selectedModule === module ? '#b91c1c' : '#9ca3af'"></i>
            </button>
            <div class="text-center p-4 text-muted" *ngIf="filteredPermissionsList.length === 0">
              <i class="fas fa-search fs-3 mb-2"></i>
              <p>No modules found.</p>
            </div>
          </div>
        </div>

        <!-- Detail Panel -->
        <div class="col-md-8 p-0 bg-white d-flex flex-column">
          <div class="permissions-detail-card h-100" *ngIf="selectedModule">
            
            <!-- Dark Grey Sub-Header for Details -->
            <div class="p-2 d-flex justify-content-between align-items-center"
              style="background-color: #4b5563; color: white;">
              <span class="fw-bold text-uppercase small" style="letter-spacing: 0.5px;">
                <i class="fas fa-circle text-danger me-2" style="font-size: 10px;"></i> {{selectedModule.displayName}} PERMISSIONS
              </span>
              <div class="form-check d-flex align-items-center m-0 me-2">
                <input class="form-check-input m-0" type="checkbox" id="selectAllModule"
                  style="cursor: pointer; transform: scale(1.1);" [checked]="isRowSelected(selectedModule)"
                  (change)="toggleRow(selectedModule, $event)">
                <label class="form-check-label fw-bold ms-2 small" for="selectAllModule"
                  style="cursor: pointer;">Grant All</label>
              </div>
            </div>

            <div class="p-4">
              <div class="row g-4">
                <ng-container *ngFor="let col of permissionColumns">
                  <div class="col-sm-6 col-md-4" *ngIf="getPermission(selectedModule, col) as perm">
                    <div
                      class="permission-item p-3 border rounded-2 hover-shadow transition-all bg-white d-flex justify-content-between align-items-center"
                      style="border-color: #e5e7eb;">
                      <span class="fw-bold text-muted small text-uppercase">{{col.action}}</span>
                      <div class="form-check m-0 p-0 d-flex align-items-center">
                        <input class="form-check-input m-0 fs-5" type="checkbox" style="cursor: pointer; border-color: #9ca3af;"
                          [(ngModel)]="perm.isUSERACCESS">
                      </div>
                    </div>
                  </div>
                </ng-container>
              </div>
            </div>
          </div>

          <div class="d-flex flex-column justify-content-center align-items-center h-100 text-muted"
            *ngIf="!selectedModule && filteredPermissionsList.length > 0">
            <i class="fas fa-hand-pointer fs-1 mb-3 text-secondary" style="opacity: 0.5;"></i>
            <h5 class="fw-light">Select a module to configure its permissions</h5>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
