<div class="table-pagination d-flex justify-content-between align-items-center p-3 border-top">
    <div class="pagination-info">
        <span class="text-muted small">
            Showing {{ totalRecords === 0 ? 0 : (page - 1) * pageSize + 1 }}-{{ (page * pageSize) > totalRecords ? totalRecords : (page * pageSize) }} of {{ totalRecords }} records
        </span>
    </div>
    <nav aria-label="Page navigation" *ngIf="totalPages > 0">
        <ul class="pagination mb-0">
            <li class="page-item" [class.disabled]="page === 1">
                <a class="page-link" href="#" (click)="setPage(page - 1, $event)" aria-label="Previous">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>
            <li class="page-item" *ngFor="let p of visiblePages" [class.active]="page === p"
                [class.disabled]="p === '...'">
                <a class="page-link" href="#" (click)="p !== '...' && setPage(p, $event)">
                    {{ p }}
                </a>
            </li>
            <li class="page-item fs-5" [class.disabled]="page === totalPages">
                <a class="page-link" href="#" (click)="setPage(page + 1, $event)" aria-label="Next">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>
        </ul>
    </nav>
</div>
