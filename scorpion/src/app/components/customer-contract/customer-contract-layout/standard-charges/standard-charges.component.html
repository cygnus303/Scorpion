<div class="p-3">
    <div class="row">
        <div class="col-5">
            <div class="row">
                <label class="col-sm-3 col-form-label fw-bold fs-6 text-secondary text-end">Charge Name</label>
                <div class="col-sm-7">
                    <input class="form-control" type="text" placeholder="Charge Name">
                </div>
            </div>
        </div>
        <div class="col-5">
            <div class="row">
                <label class="col-sm-3 col-form-label fw-bold fs-6 text-secondary text-end">Select Trans Mode</label>
                <div class="col-sm-7">
                    <input class="form-control" type="text" placeholder="Select Trans Mode">
                </div>
            </div>
        </div>
    </div>

     <div class="mt-3">
        <div class="background-color text-white rounded-top px-3 py-3 text-start cursor-pointer d-flex justify-content-between align-items-center"
            (click)="toggleFTL()" role="button" aria-expanded="false" aria-controls="collapseFTL">
            <div>
                <i class="fas fa-list me-2"></i>Sundry Single Slab Rates
            </div>
            <i class="fas fa-chevron-down collapse-icon" id="ftlIcon" [class.rotated]="isFTLCollapsed"></i>
        </div>
        <div class="collapse" [class.show]="!isFTLCollapsed" id="collapseFTL">
            <div class="rounded-bottom border-color">
                <table class="w-100 data-table rounded-0">
                    <thead>
                        <tr>
                            <th class="text-center">Id</th>
                            <th class="text-center">Rate</th>
                            <th class="text-center">Rate Type</th>
                            <th class="text-center">Transit Mode</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>
                                <input type="text" class="form-control" placeholder="Rate">
                            </td>
                            <td>
                                <ng-select class="noFoundTextColor" placeholder="Rate Type"></ng-select>
                            </td>
                            <td>
                                <ng-select class="noFoundTextColor" placeholder="Transit Mode"></ng-select>
                            </td>
                            <td>
                                <button type="button" class="btn-icon delete text-danger">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>
                                <input type="text" class="form-control" placeholder="Rate">
                            </td>
                            <td>
                                <ng-select class="noFoundTextColor" placeholder="Rate Type"></ng-select>
                            </td>
                            <td>
                                <ng-select class="noFoundTextColor" placeholder="Transit Mode"></ng-select>
                            </td>
                            <td>
                                <button type="button" class="btn-icon delete text-danger">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
