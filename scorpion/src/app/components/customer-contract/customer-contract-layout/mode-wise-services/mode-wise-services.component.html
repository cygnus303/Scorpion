<div class="cnote-entry-container p-3 pt-2">
    <!-- Title Bar -->
    <div class="bg-light border p-2 fw-bold small mb-4 rounded-1">
        Mode Wise Services
    </div>

    <!-- Transit Mode Selection (Custom Cards) -->
    <div class="d-flex flex-column align-items-center mb-4">
        <!-- <label class="fw-bold small mb-2 text-secondary">Transit Mode</label> -->
        <div class="d-flex align-items-center justify-content-center flex-wrap gap-3">
            <div *ngFor="let mode of transModes"
                class="mode-selection-card px-3 py-2 rounded-2 border cursor-pointer d-flex align-items-center gap-3 transition-all"
                [class.active]="transitMode === mode" (click)="transitMode = mode">
                <div class="radio-outer d-flex align-items-center justify-content-center">
                    <div class="radio-inner transition-all"></div>
                </div>
                <span class="fw-bold small">{{ mode }}</span>
            </div>
        </div>
    </div>

    <!-- 2 Column Layout -->
    <div class="row g-3">
        <!-- LEFT COLUMN -->
        <div class="col-md-6 d-flex flex-column gap-3">

            <!-- Cutoff Time -->
            <div class="section-container border rounded-1 overflow-hidden">
                <div class="bg-light border-bottom p-2 fw-bold small text-start">Cutoff Time</div>
                <div class="p-3">
                    <div class="d-flex align-items-center justify-content-between px-1">
                        <div class="d-flex align-items-center gap-2">
                            <label class="mb-0 fw-bold small text-muted">Hours</label>
                            <input type="number" class="form-control form-control-sm" [(ngModel)]="cutoffHours">
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <label class="mb-0 fw-bold small text-muted">Minutes</label>
                            <input type="number" class="form-control form-control-sm" [(ngModel)]="cutoffMinutes">
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <label class="mb-0 fw-bold small text-muted text-nowrap">Transit Days</label>
                            <input type="number" class="form-control form-control-sm" [(ngModel)]="cutoffTransitDays">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Freight Invoice Rate -->
            <div class="section-container border rounded-1 overflow-hidden">
                <div class="bg-light border-bottom p-2 fw-bold small text-start">Freight Invoice Rate (%)</div>
                <div class="row p-3">
                    <div class="col-4">
                        <div class="toggle-container">
                            <span class="toggle-label fw-bold lh-1 fs-6 text-secondary"
                                title="Freight as % of Invoice Apply ?">
                                Freight as % of Invoice Apply?</span>
                            <label class="toggle-switch">
                                <input type="checkbox" id="ActiveToggle" [(ngModel)]="isFreightAsInvoiceApply">
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                    </div>
                    <div class="col-4 d-flex align-items-center gap-3">
                        <label class="mb-0 fw-bold small text-muted text-nowrap" style="width: 100px;">Rate(% of
                            Inv)</label>
                        <div class="flex-grow-1">
                            <input type="number" class="form-control form-control-sm text-end">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Volumetric Conversion -->
            <div class="section-container border rounded-1 overflow-hidden">
                <div class="bg-light border-bottom p-2 fw-bold small text-start ">Volumetric Conversion</div>
                <div class="p-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="d-flex align-items-center gap-3 flex-grow-1">
                            <label class="mb-0 fw-bold small text-muted">Ratio</label>
                            <input type="number" class="form-control form-control-sm text-end"
                                [(ngModel)]="volumetricRatio">
                        </div>
                        <div class="d-flex align-items-center gap-3 flex-grow-2 w-50">
                            <label class="mb-0 fw-bold small text-muted text-nowrap">Volumetric Measure</label>
                            <div class="flex-grow-1">
                                <ng-select [items]="measureOptions" [(ngModel)]="volumetricMeasure"
                                    [clearable]="false"></ng-select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- RIGHT COLUMN -->
        <div class="col-md-6 d-flex flex-column gap-3">

            <!-- Minimum Freight - Base Wise -->
            <div class="section-container border rounded-1 overflow-hidden">
                <div class="bg-light border-bottom p-2 fw-bold small text-start">Minimum Freight - Base Wise</div>
                <div class="p-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="d-flex align-items-center gap-3 flex-grow-1">
                            <label class="mb-0 fw-bold small text-muted">Rate</label>
                            <input type="number" class="form-control form-control-sm " [(ngModel)]="minFreightRate">
                        </div>
                        <div class="d-flex align-items-center gap-3 flex-grow-2 w-50">
                            <label class="mb-0 fw-bold small text-muted">Base</label>
                            <div class="flex-grow-1">
                                <ng-select [items]="baseOptions" [(ngModel)]="minFreightBase"
                                    [clearable]="false"></ng-select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Minimum weight -->
            <div class="section-container border rounded-1 overflow-hidden">
                <div class="bg-light border-bottom p-2 fw-bold small text-start">Minimum weight</div>
                <div class="p-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="d-flex align-items-center gap-3 flex-grow-1">
                            <label class="mb-0 fw-bold small text-muted">Rate</label>
                            <input type="number" class="form-control form-control-sm " [(ngModel)]=" minWeightRate">
                        </div>
                        <div class="d-flex align-items-center gap-3 flex-grow-2 w-50">
                            <label class="mb-0 fw-bold small text-muted">Base</label>
                            <div class="flex-grow-1">
                                <ng-select [items]="weightBaseOptions" [(ngModel)]="minWeightBase"
                                    [clearable]="false"></ng-select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- GST Payer -->
            <div class="section-container border rounded-1 overflow-hidden">
                <div class="bg-light border-bottom p-2 fw-bold small text-start">GST Payer</div>
                <div class="p-3">
                    <div class="row align-items-center mb-2 g-2">
                        <div class="col-7 d-flex align-items-center gap-3">
                            <label class="mb-0 fw-bold small text-muted text-nowrap"
                                style="width: 100px;">Options</label>
                            <div class="flex-grow-1">
                                <ng-select [items]="gstOptions" [(ngModel)]="gstOption" [clearable]="false"></ng-select>
                            </div>
                        </div>
                        <div class="col-5">
                            <div class="toggle-container">
                                <span class="toggle-label fw-bold lh-1 fs-6 text-secondary"
                                    title="Volumetric">Active</span>
                                <label class="toggle-switch">
                                    <input type="checkbox" id="ActiveToggle" [(ngModel)]="gstActive">
                                    <span class="toggle-slider"></span>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="row align-items-center g-2">
                        <div class="col-7 d-flex align-items-center gap-3">
                            <label class="mb-0 fw-bold small text-muted text-nowrap" style="width: 100px;">Default
                                Selection</label>
                            <div class="flex-grow-1">
                                <ng-select [items]="payerOptions" [(ngModel)]="gstDefault"
                                    [clearable]="false"></ng-select>
                            </div>
                        </div>
                        <div class="col-5 d-flex align-items-center gap-2">
                            <label class="mb-0 fw-bold small text-muted text-nowrap ms-2">GST Paid By</label>
                            <div class="flex-grow-1">
                                <ng-select [items]="payerOptions" [(ngModel)]="gstPaidBy"
                                    [clearable]="false"></ng-select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Full Width Parameters (Fuel Surcharge) -->
    <div class="mt-3 d-flex flex-column gap-3">

        <!-- Fuel Surcharge / PTL -->
        <div class="section-container border rounded-1 overflow-hidden">
            <div class="bg-light border-bottom p-2 fw-bold small text-start d-flex justify-content-between">
                <span>Fuel Surcharge / PTL</span>
                <i class="fas fa-燃油 text-muted small"></i>
            </div>
            <div class="p-2">
                <div class="d-flex align-items-center justify-content-between gap-2">
                    <div class="parameter-group border-end pe-2 flex-grow-1">
                        <label class="x-small text-muted d-block mb-1 fw-bold">Min Charge</label>
                        <input type="number" class="form-control form-control-sm text-end" [(ngModel)]="fuelPTLMin">
                    </div>
                    <div class="parameter-group border-end pe-2 flex-grow-1">
                        <label class="x-small text-muted d-block mb-1 fw-bold">Max Charge</label>
                        <input type="number" class="form-control form-control-sm text-end" [(ngModel)]="fuelPTLMax">
                    </div>
                    <div class="parameter-group border-end pe-2 flex-grow-1">
                        <label class="x-small text-muted d-block mb-1 fw-bold">Charge Rate</label>
                        <div class="d-flex align-items-center gap-1">
                            <input type="number" class="form-control form-control-sm text-end"
                                [(ngModel)]="fuelPTLRate">
                        </div>
                    </div>
                    <div class="parameter-group flex-grow-2" style="width: 250px;">
                        <label class="x-small text-muted d-block mb-1 fw-bold">Rate Type</label>
                        <ng-select [items]="rateTypes" [(ngModel)]="fuelPTLRateType" [clearable]="false"></ng-select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Fuel Surcharge / FTL -->
        <div class="section-container border rounded-1 overflow-hidden">
            <div class="bg-light border-bottom p-2 fw-bold small d-flex justify-content-between">
                <span>Fuel Surcharge / FTL</span>
            </div>
            <div class="p-2">
                <div class="d-flex align-items-center justify-content-between gap-2">
                    <div class="parameter-group border-end pe-2 flex-grow-1">
                        <label class="x-small text-muted d-block mb-1 fw-bold">Min Charge</label>
                        <input type="number" class="form-control form-control-sm text-end" [(ngModel)]="fuelFTLMin">
                    </div>
                    <div class="parameter-group border-end pe-2 flex-grow-1">
                        <label class="x-small text-muted d-block mb-1 fw-bold">Max Charge</label>
                        <input type="number" class="form-control form-control-sm text-end" [(ngModel)]="fuelFTLMax">
                    </div>
                    <div class="parameter-group border-end pe-2 flex-grow-1">
                        <label class="x-small text-muted d-block mb-1 fw-bold">Charge Rate</label>
                        <input type="number" class="form-control form-control-sm text-end" [(ngModel)]="fuelFTLRate">
                    </div>
                    <div class="parameter-group flex-grow-2" style="width: 250px;">
                        <label class="x-small text-muted d-block mb-1 fw-bold">Rate Type</label>
                        <ng-select [items]="rateTypes" [(ngModel)]="fuelFTLRateType" [clearable]="false"></ng-select>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Actions -->
    <div class="mt-4 mb-2 d-flex justify-content-center gap-3">
        <button class="btn btn-save-continue px-5 py-2 text-white fw-bold shadow-sm" (click)="onSubmit()">
            Save & Continue
        </button>
        <button class="btn btn-save-keep px-5 py-2 text-white fw-bold shadow-sm" (click)="onSaveAndKeep()">
            Save & Keep On Same Page
        </button>
    </div>
</div>
