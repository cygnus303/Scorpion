<div class="cnote-entry-container p-3">
    <!-- Selection Criteria Section -->
    <div class="border-radius p-4 mb-3">
        <div class="row pb-4">
            <div class="col-3">
                <div class="form-group-input">
                    <label class="form-label fw-bold lh-1 fs-6 text-secondary">Charge Name</label>
                    <input type="text" class="form-control" [(ngModel)]="chargeName" placeholder="Charge Name">
                </div>
            </div>
            <div class="col-3">
                <div class="form-group-input">
                    <label class="form-label fw-bold lh-1 fs-6 text-secondary">Select Trans Mode</label>
                    <ng-select [items]="transModes" [(ngModel)]="transMode" placeholder="Select Trans Mode"></ng-select>
                </div>
            </div>
            <div class="col-3">
                <div class="form-group-input">
                    <label class="form-label fw-bold lh-1 fs-6 text-secondary">Select Matrix Type</label>
                    <ng-select [items]="matrixTypes" [(ngModel)]="matrixType" (change)="onMatrixTypeChange()"
                        placeholder="Select Matrix Type"></ng-select>
                </div>
            </div>
            <div class="col-3">
                <div class="form-group-input">
                    <label class="form-label fw-bold lh-1 fs-6 text-secondary">From</label>
                    <ng-select [items]="fromOptions" [(ngModel)]="fromLocation"
                        [placeholder]="'Select From ' + fromLabel"></ng-select>
                </div>
            </div>
        </div>
        <div class="row pb-4">
            <div class="col-3">
                <div class="form-group-input">
                    <label class="form-label fw-bold lh-1 fs-6 text-secondary">To</label>
                    <ng-select [items]="toOptions" [(ngModel)]="toLocation"
                        [placeholder]="'Select To ' + toLabel"></ng-select>
                </div>
            </div>
        </div>
    </div>

    <!-- Sundry Rates Section -->
    <div class="mt-3">
        <div class="background-color text-white rounded-top px-3 py-3 text-start cursor-pointer d-flex justify-content-between align-items-center"
            (click)="toggleTable()" role="button" aria-expanded="true">
            <div class="fw-semibold">
                <i class="fas fa-list me-2"></i>Sundry Single Slab Rates
            </div>
            <i class="fas fa-chevron-down collapse-icon" [class.rotated]="isTableCollapsed"></i>
        </div>
        <div class="collapse" [class.show]="!isTableCollapsed">
            <div class="rounded-bottom border border-top-0 p-3">
                <!-- Controls Above Table -->
                <div class="d-flex justify-content-end align-items-center gap-3 mb-3">
                    <div class="d-flex align-items-center gap-2">
                        <label class="fw-semibold mb-0">No Of Rows :</label>
                        <input type="number" class="form-control text-center" style="width: 70px; height: 30px;"
                            [(ngModel)]="noOfRows">
                    </div>
                    <button class="btn btn-primary d-flex align-items-center gap-2 py-1 px-3" (click)="addNewRow()">
                        Add New Row <i class="fas fa-arrow-circle-right ms-1"></i>
                    </button>
                </div>

                <!-- Table -->
                <div class="">
                    <table class="w-100 data-table rounded-0">
                        <thead>
                            <tr>
                                <th class="text-center" style="width: 50px;">Id</th>
                                <th class="text-center">From {{ fromLabel }}</th>
                                <th class="text-center">To {{ toLabel }}</th>
                                <th class="text-center">Rate</th>
                                <th class="text-center">% of Basic Freight</th>
                                <th class="text-center">Std. Transit days</th>
                                <th class="text-center">Customer Transit days</th>
                                <th class="text-center">Transit Mode</th>
                                <th class="text-center">Billing State</th>
                                <th class="text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let row of tableRows; let i = index">
                                <td class="text-center">{{ row.id }}</td>
                                <td>
                                    <ng-select class="noFoundTextColor" [items]="fromOptions" [(ngModel)]="row.from"
                                        [placeholder]="fromLabel"></ng-select>
                                </td>
                                <td>
                                    <ng-select class="noFoundTextColor" [items]="toOptions" [(ngModel)]="row.to"
                                        [placeholder]="toLabel"></ng-select>
                                </td>
                                <td>
                                    <input type="number" class="form-control" [(ngModel)]="row.rate" placeholder="Rate">
                                </td>
                                <td>
                                    <ng-select class="noFoundTextColor" [items]="rateTypes" [(ngModel)]="row.rateType"
                                        placeholder="Rate Type"></ng-select>
                                </td>
                                <td>
                                    <input type="number" class="form-control text-center"
                                        [(ngModel)]="row.stdTransitDays" placeholder="0">
                                </td>
                                <td>
                                    <input type="number" class="form-control text-center"
                                        [(ngModel)]="row.customerTransitDays" placeholder="0">
                                </td>
                                <td>
                                    <ng-select class="noFoundTextColor" [items]="transModes"
                                        [(ngModel)]="row.transitMode" placeholder="Transit Mode"></ng-select>
                                </td>
                                <td>
                                    <ng-select class="noFoundTextColor" [items]="billingStates"
                                        [(ngModel)]="row.billingState" placeholder="Billing State"></ng-select>
                                </td>
                                <td class="text-center">
                                    <button type="button" (click)="removeRow(i)"
                                        class="btn-icon-delete delete text-danger">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Bottom Add New Row -->
                <div class="d-flex justify-content-end mt-3">
                    <button class="btn btn-primary px-3 py-1" (click)="addNewRow()">+ Add New Row</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Overall Actions -->
    <div class="mt-4 text-center">
        <button class="btn btn-success px-4 py-2 fw-semibold rounded-1 text-white">
            <i class="fas fa-check me-2"></i>Save & Continue
        </button>
    </div>
</div>
