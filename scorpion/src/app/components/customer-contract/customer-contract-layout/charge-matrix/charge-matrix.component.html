<div class="p-4">
    <div class="row">
        <div class="col-5">
            <div class="row">
                <label class="col-sm-3 col-form-label fw-bold fs-6 text-secondary text-end">Charge at time of</label>
                <div class="col-sm-7">
                    <input class="form-control" type="text" placeholder="Charge at time of">
                </div>
            </div>
        </div>
    </div>
    
    <div class="mt-3">
        <div class="background-color text-white rounded-top px-3 py-3 text-start cursor-pointer d-flex justify-content-between align-items-center"
            (click)="toggleFTL()" role="button" aria-expanded="false" aria-controls="collapseFTL">
            <div>
                <i class="fas fa-list me-2"></i>Charge Matrix Defination
            </div>
            <i class="fas fa-chevron-down collapse-icon" id="ftlIcon" [class.rotated]="isFTLCollapsed"></i>
        </div>
        <div class="collapse" [class.show]="!isFTLCollapsed" id="collapseFTL">
            <div class="rounded-bottom border-color">
                <table class="w-100 data-table rounded-0">
                    <thead>
                        <tr>
                            <th class="text-center">Charge Name</th>
                            <th class="text-center">Charge Based On</th>
                            <th class="text-center">Use From</th>
                            <th class="text-center">Use To</th>
                            <th class="text-center">Use Transit Mode</th>
                            <th class="text-center">Use Rate Type</th>
                            <th class="text-center">Slab Type</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><input type="text" class="form-control" placeholder="Charge Name"></td>
                            <td>
                                <ng-select class="noFoundTextColor" placeholder="Charge Based On"></ng-select>
                            </td>
                            <td>
                                <label class="toggle-switch justify-content-start">
                                    <input type="checkbox" id="useFrom">
                                    <span class="toggle-slider"></span>
                                </label>
                            </td>
                            <td>
                                <label class="toggle-switch justify-content-start">
                                    <input type="checkbox" id="useTo">
                                    <span class="toggle-slider"></span>
                                </label>
                            </td>
                            <td>
                                <label class="toggle-switch justify-content-start">
                                    <input type="checkbox" id="useTransitMode">
                                    <span class="toggle-slider"></span>
                                </label>
                            </td>
                            <td>
                                <label class="toggle-switch justify-content-start">
                                    <input type="checkbox" id="useRateType">
                                    <span class="toggle-slider"></span>
                                </label>
                            </td>
                    
                            <td>
                                <div class="radio-group justify-content-center">
                                    <div class="radio-option" style="flex: 1;">
                                        <input type="radio" id="na" name="na" value="na">
                                        <label for="na">NA </label>
                                    </div>
                                    <div class="radio-option" style="flex: 1;">
                                        <input type="radio" id="directSlab" name="directSlab" value="directSlab">
                                        <label for="directSlab">Direct Slab</label>
                                    </div>
                                </div>
                            </td>
                        </tr>
                         <tr>
                            <td><input type="text" class="form-control" placeholder="Charge Name"></td>
                            <td>
                                <ng-select class="noFoundTextColor" placeholder="Charge Based On"></ng-select>
                            </td>
                            <td>
                                <label class="toggle-switch justify-content-start">
                                    <input type="checkbox" id="useFrom">
                                    <span class="toggle-slider"></span>
                                </label>
                            </td>
                            <td>
                                <label class="toggle-switch justify-content-start">
                                    <input type="checkbox" id="useTo">
                                    <span class="toggle-slider"></span>
                                </label>
                            </td>
                            <td>
                                <label class="toggle-switch justify-content-start">
                                    <input type="checkbox" id="useTransitMode">
                                    <span class="toggle-slider"></span>
                                </label>
                            </td>
                            <td>
                                <label class="toggle-switch justify-content-start">
                                    <input type="checkbox" id="useRateType">
                                    <span class="toggle-slider"></span>
                                </label>
                            </td>
                    
                            <td>
                                <div class="radio-group justify-content-center">
                                    <div class="radio-option" style="flex: 1;">
                                        <input type="radio" id="na" name="na" value="na">
                                        <label for="na">NA </label>
                                    </div>
                                    <div class="radio-option" style="flex: 1;">
                                        <input type="radio" id="directSlab" name="directSlab" value="directSlab">
                                        <label for="directSlab">Direct Slab</label>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
