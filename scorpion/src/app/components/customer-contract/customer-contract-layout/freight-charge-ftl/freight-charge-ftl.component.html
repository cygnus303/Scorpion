<div class="cnote-entry-container p-3">
    <!-- Selection Criteria Section -->
    <div class="border-radius p-3 mb-3">
        <div class="row g-3">
            <div class="col-3">
                <div class="form-group-input">
                    <label class="form-label text-secondary fw-bold lh-1 fs-6">Matrix Name</label>
                    <input type="text" class="form-control form-control-sm" [(ngModel)]="matrixName"
                        placeholder="Matrix Name">
                </div>
            </div>
            <div class="col-3">
                <div class="form-group-input">
                    <label class="form-label text-secondary fw-bold lh-1 fs-6">Trans Mode</label>
                    <ng-select [items]="transModes" [(ngModel)]="transMode" placeholder="Trans Mode"></ng-select>
                </div>
            </div>
            <div class="col-3">
                <div class="form-group-input">
                    <label class="form-label text-secondary fw-bold lh-1 fs-6">Matrix Type</label>
                    <ng-select [items]="matrixTypes" [(ngModel)]="matrixType" (change)="onMatrixTypeChange()"
                        placeholder="Matrix Type"></ng-select>
                </div>
            </div>
            <div class="col-3">
                <div class="form-group-input">
                    <label class="form-label text-secondary fw-bold lh-1 fs-6">FTL Type</label>
                    <ng-select [items]="ftlTypes" [(ngModel)]="ftlType" placeholder="FTL Type"></ng-select>
                </div>
            </div>
        </div>
        <div class="row g-3 mt-1">
            <div class="col-3">
                <div class="form-group-input">
                    <label class="form-label text-secondary fw-bold lh-1 fs-6">From</label>
                    <ng-select [items]="fromOptions" [(ngModel)]="fromLocation"
                        [placeholder]="'From ' + fromLabel"></ng-select>
                </div>
            </div>
            <div class="col-3">
                <div class="form-group-input">
                    <label class="form-label text-secondary fw-bold lh-1 fs-6">To</label>
                    <ng-select [items]="toOptions" [(ngModel)]="toLocation" [placeholder]="'To ' + toLabel"></ng-select>
                </div>
            </div>
        </div>
    </div>

    <!-- FTL Freight Matrix Section -->
    <div class="mt-3">
        <div class="background-color text-white rounded-top px-3 py-2 text-start cursor-pointer d-flex justify-content-between align-items-center"
            (click)="toggleTable()">
            <div class="fw-semibold small">
                FTL Freight Matrix
            </div>
            <i class="fas fa-chevron-down collapse-icon" [class.rotated]="isTableCollapsed"></i>
        </div>
        <div class="collapse" [class.show]="!isTableCollapsed">
            <div class="rounded-bottom border border-top-0 p-3">
                <!-- Controls Above Table -->
                <div class="d-flex justify-content-end align-items-center gap-3 mb-3">
                    <div class="d-flex align-items-center gap-2">
                        <label class="fw-semibold mb-0 small">No Of Rows :</label>
                        <input type="number" class="form-control text-center text-primary fw-bold"
                            style="width: 60px; height: 28px;" [(ngModel)]="noOfRows">
                    </div>
                    <button class="btn btn-primary d-flex align-items-center gap-2 py-1 px-3 small rounded-1"
                        (click)="addNewRow()">
                        Add New Row <i class="fas fa-arrow-circle-right ms-1"></i>
                    </button>
                </div>

                <!-- Table -->
                <div class="table-responsive">
                    <table class="w-100 data-table rounded-0">
                        <thead>
                            <tr>
                                <th class="text-center" style="width: 40px;"><input type="checkbox"></th>
                                <th class="text-center" style="width: 50px;">Id</th>
                                <th class="text-center">From {{ fromLabel }}</th>
                                <th class="text-center">To {{ toLabel }}</th>
                                <th class="text-center">FTL Type</th>
                                <th class="text-center">Rate</th>
                                <th class="text-center">Transit Days</th>
                                <th class="text-center">Rate Type</th>
                                <th class="text-center">Transit Mode</th>
                                <th class="text-center">Billing State</th>
                                <th class="text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let row of tableRows; let i = index">
                                <td class="text-center"><input type="checkbox"></td>
                                <td class="text-center">{{ row.id }}</td>
                                <td>
                                    <ng-select [items]="fromOptions" [(ngModel)]="row.from"
                                        [placeholder]="'Select From ' + fromLabel"></ng-select>
                                </td>
                                <td>
                                    <ng-select [items]="toOptions" [(ngModel)]="row.to"
                                        [placeholder]="'Select To ' + toLabel"></ng-select>
                                </td>
                                <td>
                                    <ng-select [items]="ftlTypes" [(ngModel)]="row.ftlType"
                                        placeholder="FTL Type"></ng-select>
                                </td>
                                <td>
                                    <input type="number" class="form-control text-center" [(ngModel)]="row.rate"
                                        placeholder="0">
                                </td>
                                <td>
                                    <input type="number" class="form-control text-center" [(ngModel)]="row.transitDays"
                                        placeholder="0">
                                </td>
                                <td>
                                    <ng-select [items]="rateTypes" [(ngModel)]="row.rateType"
                                        placeholder="Rate Type"></ng-select>
                                </td>
                                <td>
                                    <ng-select [items]="transModes" [(ngModel)]="row.transitMode"
                                        placeholder="Transit Mode"></ng-select>
                                </td>
                                <td>
                                    <ng-select [items]="billingStates" [(ngModel)]="row.billingState"
                                        placeholder="Billing State"></ng-select>
                                </td>
                                <td class="text-center">
                                    <button type="button" (click)="removeRow(i)"
                                        class="btn-icon-delete delete text-danger">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Add Item Button -->
                <div class="d-flex justify-content-end mt-3">
                    <button class="btn btn-primary px-3 py-1 rounded-1 small" (click)="addNewRow()">+ Add Item</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Overall Actions -->
    <div class="mt-4 border-top pt-4">
        <div class="d-flex justify-content-center gap-2">
            <button class="btn btn-success text-white px-3 py-1 fw-semibold small rounded-1">
                <i class="fas fa-download me-2"></i>Download FTL Excel
            </button>
            <button class="btn btn-success text-white px-4 py-1 fw-semibold small rounded-1" (click)="onSubmit()">
                <i class="fas fa-check me-2"></i>Save & Continue
            </button>
            <button class="btn btn-primary text-white px-3 py-1 fw-semibold small rounded-1">
                <i class="fas fa-upload me-2"></i>Upload FTL Excel
            </button>
            <button class="btn btn-success text-white px-3 py-1 fw-semibold small rounded-1">
                <i class="fas fa-download me-2"></i>Download FTL Excel Template
            </button>
        </div>
    </div>
</div>
