<nav class="vendor-drawer" id="vendorDrawer" [class.collapsed]="isCollapsed">
    <div class="vendor-drawer-header">
      <div class="brand-logo" style="justify-content: center;">
        <img *ngIf="!isCollapsed" src="./assets/img/logos/logo.png" alt="Logo" class="brand-img">
        <div *ngIf="isCollapsed" class="sb-logo-mark">S</div>
      </div>
    </div>
    
    <div class="sb-section-label">Main Menu</div>
    
    <button class="vendor-nav-btn" routerLink="dashboard" [class.active]="isActive('dashboard')" data-tooltip="Dashboard">
      <svg class="sb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      <span>Dashboard</span>
    </button>
    
    <button class="vendor-nav-btn" routerLink="invoice-generation" [class.active]="isActive('invoice-generation')" data-tooltip="Invoice Generation">
      <svg class="sb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="M9 15l3-3 3 3"/></svg>
      <span>Invoice Generation/Upload</span>
    </button>
    
    <button class="vendor-nav-btn" routerLink="reports" [class.active]="isActive('reports')" data-tooltip="Report">
      <svg class="sb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 15l4-5 3 3 5-7"/></svg>
      <span>Report</span>
    </button>
    
    <button class="vendor-nav-btn" routerLink="invoice-tracker" [class.active]="isActive('invoice-tracker')" data-tooltip="Invoice Tracker">
      <svg class="sb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h4"/></svg>
      <span>Invoice Tracker</span>
    </button>
    
    <button class="vendor-nav-btn" routerLink="query-response" [class.active]="isActive('query-response')" data-tooltip="Query Response">
      <svg class="sb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/><path d="M9.5 9a2.5 2.5 0 0 1 4.9.7c0 1.6-2.4 2.3-2.4 2.3"/><path d="M12 16h.01"/></svg>
      <span>Query Response</span>
    </button>
    
    <button class="vendor-nav-btn" routerLink="payment-followup" [class.active]="isActive('payment-followup')" data-tooltip="Payment Followup">
      <svg class="sb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>Payment Followup</span>
    </button>
    
    <div style="flex-grow: 1;"></div>
    
    <div class="vendor-drawer-footer">
      <div class="sb-user">
        <div class="sb-user-avatar" id="sbUserAvatar">V</div>
        <div class="sb-user-details">
          <div class="sb-user-name" id="sbUserName">vendor1</div>
          <div class="sb-user-role">Vendor Account</div>
        </div>
      </div>
    </div>
  </nav>
