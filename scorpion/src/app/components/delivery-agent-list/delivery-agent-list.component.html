<div class="cnote-entry-container px-1">
    <div class="text-white px-3 py-3 d-flex align-items-center justify-content-between fw-semibold background-color">
        <div>
            <i class="fas fa-list me-2"></i>
           List of Delivery Agents
        </div>
        <div>
            <button class="btn btn-light btn-sm me-2 fw-bold">
                <i class="fas fa-download"></i> Download Excel
            </button>
            <button class="btn btn-light btn-sm fw-bold" (click)="openDeliveryAgentsPopup()">
                <i class="fas fa-user-plus"></i> Add User
            </button>
        </div>
    </div>
    <div class="table-responsive mt-3">
        <table class="table table-striped table-hover align-middle custom-table">
            <thead>
                <tr>
                    <th>Sr. No</th>
                    <th>Delivery Agent ID</th>
                    <th>Delivery Agent Name</th>
                    <th>Location</th>
                    <th>BA Name</th>
                    <th class="text-center">Active Status</th>
                    <th class="text-center">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let data of deliveryAgentsList;let i=index">
                    <td>{{i+1}}</td>
                    <td>{{data.dA_Code}}</td>
                    <td>{{data.deliveryAgentName}}</td>
                    <td>{{data.location}}</td>
                    <td>{{data.vehicleInfo}}</td>
                    <td class="text-center">
                        <ng-container *ngIf="data.status; else inactive">
                            <i class="fas fa-check-square text-success me-1 fs-4"></i>
                        </ng-container>
                        <ng-template #inactive>
                            <i class="fas fa-window-close text-danger fs-4"></i>
                        </ng-template>
                    </td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-secondary me-1" title="Edit" (click)="openDeliveryAgentsPopup(data)">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-sm btn-info text-white" title="View" (click)="opendeliveryAgentViewPopup(data)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<delivery-agent-modal #deliveryAgentPopup (dataEvent)="getDeliveryAgentList()"></delivery-agent-modal>
<delivery-agent-view #deliveryAgentViewPopup></delivery-agent-view>
