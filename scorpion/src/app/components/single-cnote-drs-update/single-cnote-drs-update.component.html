<!-- ══ FORWARD PFM MODAL ══ -->
<ng-template #Templatepod>
    <div class="modal-header">
        <div class="d-flex align-items-center gap-3">
            <div class="pfm-icon fs-4 fw-bold" style="background:#e8f0fe;border:1px solid #aac4f5;">↗</div>
            <div>
                <div class="fw-bold fs-5">Single cnote DRS Update</div>
                <div class="pfm-subtitle">Complete DRS update details below</div>
            </div>
        </div>
        <button type="button" class="btn-close pfm-close" (click)="modalRef.hide()"></button>
    </div>
    <form>
        <div class="modal-body" style="padding:0;gap:0;">
            <div style="padding:16px 22px;border-bottom:1px solid var(--border-light);" class="input-background-color">
                <div class="row">
                    <div class="col-4">
                        <div class="form-group-input">
                            <label class="form-label meta-label d-flex align-items-center gap-2">
                                DRS Number
                                <span class="text-primary border border-primary-subtle px-2 rounded"
                                    >
                                    {{'DS/PIM/2526/002772'}}
                                </span>
                            </label>
                        </div>
                    </div>
                    <div class="col-3">
                        <div class="form-group-input">
                             <label class="form-label meta-label d-flex align-items-center gap-2">
                                DRS Date
                                <span class="text-primary border border-primary-subtle px-2 rounded"
                                    >
                                    {{'18-07-2025 10:32:00 AM'}}
                                </span>
                            </label>
                        </div>
                    </div>
                    <div class="col-2">
                        <div class="form-group-input">
                            <label class="form-label meta-label d-flex align-items-center gap-2">
                                Driver Name
                                <span class="text-primary border border-primary-subtle px-2 rounded"
                                    >
                                    {{'of Vehicle MH04BD0356 Carrying 12 Consignment(s)'}}
                                </span>
                            </label>
                        </div>
                    </div>
                </div>
               
            </div>

            <!-- ── LR Listing ── -->
            <div style="padding:14px 22px 0;">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
                    <div
                        style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);">
                        CNote Details</div>
                    <div id="fwdExcludeNote" style="font-size:11px;color:var(--orange);font-weight:600;"
                        *ngIf="totalLRs < pfmData.length">⚠ Unchecked LRs will be reset to Pending</div>
                </div>
                <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden; ">
                    <div style="max-height: 250px; overflow-y: auto;">
                        <table style="width:100%;border-collapse:collapse;font-size:13px;">
                            <thead style="position: sticky; top: 0; z-index: 1;">
                                <tr class="input-background-color" style="border-bottom:1px solid var(--border);">
                                    <th
                                        style="padding:9px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);text-align:left;">
                                        IS Bad Pod</th>
                                    <th
                                        style="padding:9px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);text-align:left;">
                                        Sr.No</th>
                                    <th
                                        style="padding:9px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);text-align:left;">
                                        AXB Bkg. Dt.</th>
                                    <th
                                        style="padding:9px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);text-align:left;">
                                        Bkg-Dely Dest.Loc Pay Basis</th>
                                    <th
                                        style="padding:9px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);text-align:left;">
                                        Cnor/Cnee</th>
                                   <th
                                        style="padding:9px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);text-align:left;">
                                        Pkgs Pending/Arrived/Booked</th>
                                    <th
                                        style="padding:9px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);text-align:left;">
                                        Committed Dely. Dt</th>
                                    <th
                                        style="padding:9px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);text-align:left;">
                                        Pkgs.Dely</th>
                                         <th
                                        style="padding:9px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);text-align:left;">
                                        Delivery Control Loc</th>
                                </tr>
                            </thead>
                            <!-- <tbody id="fwdLrBody">
                                <tr *ngFor="let row of pfmData" style="border-bottom: 1px solid var(--border-light);"
                                    [style.background]="row.checked ? 'var(--accent-glow)' : 'transparent'">
                                    <td style="text-align:center;padding:9px 12px;">
                                        <input type="checkbox" [(ngModel)]="row.checked"
                                            [ngModelOptions]="{standalone: true}" (change)="toggleFwdLr(row)"
                                            style="width:15px;height:15px;accent-color:var(--accent);cursor:pointer;">
                                    </td>
                                    <td style="padding:9px 12px;">
                                        <span class="lr-date">{{row.dockDt | date:'dd MMM yyyy'}}</span>
                                    </td>
                                    <td style="padding:9px 12px;">
                                        <span class="lr-no">{{row.dockNo}}</span>
                                    </td>
                                    <td style="padding:9px 12px;">
                                        <div class="location-cell">
                                            <div class="loc-dot origin"></div>{{row.from_To?.split(':')[0]}}
                                        </div>
                                    </td>
                                    <td style="padding:9px 12px;">
                                        <div class="location-cell">
                                            <div class="loc-dot dest"></div>{{row.from_To?.split(':')[1]}}
                                        </div>
                                    </td>
                                    <td style="padding:9px 12px;font-size:12px;color:var(--text-secondary);">
                                        {{row.party_name}}</td>
                                </tr>
                            </tbody> -->
                        </table>
                    </div>
                </div>
            </div>

            <!-- ── Remarks ── -->
            <div style="padding:14px 22px 18px;">
                <div class="form-group-input">
                    <label class="fw-bolder mb-2">Remarks</label>
                    <textarea class="form-control-textarea input-background-color mb-2" formControlName="remarks"
                        placeholder="Any special forwarding instructions or notes…"></textarea>
                </div>
            </div>
        </div>
    </form>
    <div class="modal-footer d-flex justify-content-between">
        <div><span class="text-danger">*</span> Required fields</div>
        <div class="gap-3 d-flex">
            <button type="button" class="btn btn-light px-4 py-2 rounded" (click)="modalRef.hide()">Cancel</button>
            <button type="button" class="btn btn-primary px-4 py-2 rounded" 
                >
                <span class="me-2 fs-5">↗</span> Submit Forward
            </button>
        </div>
    </div>
</ng-template>
