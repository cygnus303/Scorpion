
   <div class="d-flex row col-md-10">
         <div class="cnote-entry-container px-1 ">
            <div class="text-white px-3 py-3 d-flex align-items-center fw-semibold background-color">
                <i class="fas fa-filter me-2"></i>
                Docket Financial Edit Criteria
            </div>
            <div class="form-grid p-4">
                     <div class="row align-items-center mb-3">
                    <div class="col-md-3 text-start">
                        <input type="text" class="form-control required2" placeholder="Select Paybas">
                    </div>
                    <div class="col-md-5">
                        <div class="input-group shadow-sm rounded "><span class="input-group-text bg-white border-end-0 p-2">
                          <i class="fas fa-calendar-alt text-dark text-secondary"></i></span>
                            <input type="text" placeholder="Daterangepicker" class="form-control border-start-1 text-center line-height" bsDaterangepicker
                                [(ngModel)]="dateRange" [bsConfig]="{ ranges: commonService.ranges ,rangeInputFormat: 'MMMM D, YYYY', dateInputFormat:
                                                     'MMMM D, YYYY'}">
                        </div>
                    </div>
                </div>
                <div class="row align-items-center mb-3">
                        <label class="control-label col-md-1" style="text-align: left;"></label>
                        <label class="form-label col-md-2 text-start fw-semibold">
                            Select Paybas
                        </label>
                    <div class="col-md-5">
                        <input type="text" class="form-control required2" placeholder="Select Paybas">
                    </div>
                </div>
                 <div class="row align-items-center mb-3">
                    <label class="control-label col-md-1" style="text-align: left;"></label>
                        <label class="form-label col-md-2 text-start fw-semibold">
                            Select Mode
                        </label>
                    <div class="col-md-5">
                        <input type="text" class="form-control required2" placeholder="Select Mode">
                    </div>
                </div>
                 <div class="row align-items-center mb-3">
                    <label class="control-label col-md-1" style="text-align: left;"></label>
                        <label class="form-label col-md-2 text-start fw-semibold">
                            Select Business Type
                        </label>
                    <div class="col-md-5">
                        <input type="text" class="form-control required2" placeholder="Select Business Type">
                    </div>
                </div>
                 <div class="row align-items-center mb-3">
                     <label class="control-label col-md-1" style="text-align: left;"></label>
                        <label class="form-label col-md-2 text-start fw-semibold">
                           Loading By
                        </label>
                    <div class="col-md-5">
                        <input type="text" class="form-control required2" placeholder="Loading By">
                    </div>
                </div>
                 <div class="row align-items-center mb-3">
                     <label class="control-label col-md-1" style="text-align: left;"></label>
                        <label class="form-label col-md-2 text-start fw-semibold">
                            Charge type
                        </label>
                    <div class="col-md-5">
                        <input type="text" class="form-control required2" placeholder="Charge type">
                    </div>
                </div>
                 <div class="row align-items-center mb-3">
                     <label class="control-label col-md-1" style="text-align: left;"></label>
                        <label class="form-label col-md-2 text-start fw-semibold">
                            Select Booked Type
                        </label>
                    <div class="col-md-5">
                        <input type="text" class="form-control required2" placeholder="Select Booked Type">
                    </div>
                </div>
                 <div class="row align-items-center mb-3">
                    <label class="control-label col-md-1" style="text-align: left;"></label>
                        <label class="form-label col-md-2 text-start fw-semibold">
                            Select Booked By
                        </label>
                    <div class="col-md-5">
                        <input type="text" class="form-control required2" placeholder="Select Booked By">
                    </div>
                </div>
                  <div class="row align-items-center mb-3">
                    <div class="col-md-3 text-start"> </div>
                    <div class="col-md-5 text-start">
                        OR
                    </div>
                </div>
                  <div class="row align-items-center mb-3">
                    <label class="control-label col-md-1" style="text-align: left;"></label>
                        <label class="form-label col-md-2 text-start fw-semibold">
                           CNote No.
                        </label>
                    <div class="col-md-5">
                        <input type="text" class="form-control required2" placeholder="CNote No.">
                    </div>
                </div>

                <div class="p-4 bg-light">
                    <div class="col-md-12 d-flex gap-2">
                        <div class="col-md-8">
                            <button type="button" class="btn background text-white btn-sm px-3"><i
                                    class="fas fa-search"></i>&nbsp;Search</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

   </div>
