   <div class="d-flex row col-md-10">
         <div class="cnote-entry-container px-1 ">
            <div class="text-white px-3 py-3 d-flex align-items-center fw-semibold background-color">
                <i class="fas fa-filter me-2"></i>
                CNote Criteria for {{typeName}}
            </div>
        <form [formGroup]="challanService.filterForm">
            <div class="form-grid p-4">
                     <div class="row align-items-center mb-3">
                    <div class="col-md-3 text-start">
                        <ng-select class="noFoundTextColor" placeholder="CNote Booking Date" [items]="dateType" bindLabel="text" bindValue="value" formControlName="bookingDateType">
                        </ng-select>
                    </div>
                    <div class="col-md-5">
                        <div class="input-group shadow-sm rounded "><span class="input-group-text bg-white border-end-0 p-2">
                          <i class="fas fa-calendar-alt text-dark text-secondary"></i></span>
                            <input type="text" placeholder="Daterangepicker" class="form-control border-start-1 text-center line-height" bsDaterangepicker
                                formControlName="dateRange" [bsConfig]="{ ranges: commonService.ranges ,rangeInputFormat: 'MMMM D, YYYY', dateInputFormat:
                                                     'MMMM D, YYYY'}">
                        </div>
                    </div>
                </div>
                <div class="row align-items-center mb-3">
                        <label class="control-label col-md-1" style="text-align: left;"></label>
                        <label class="form-label col-md-2 text-start fw-semibold">
                            Select Paybas
                        </label>
                    <div class="col-md-5">
                          <ng-select class="noFoundTextColor required2 clear-icon" placeholder="Select Paybas"
                                formControlName="paybas" bindLabel="codeDesc" bindValue="codeId" [items]="generalMasterService.PayBsData">
                            </ng-select>
                    </div>
                </div>
                 <div class="row align-items-center mb-3">
                    <label class="control-label col-md-1" style="text-align: left;"></label>
                        <label class="form-label col-md-2 text-start fw-semibold">
                            Select Mode
                        </label>
                    <div class="col-md-5">
                       <ng-select class="noFoundTextColor required2 clear-icon" placeholder="Select Mode"
                                formControlName="trnMod" bindLabel="codeDesc" bindValue="codeId" [items]="generalMasterService.modeData">
                            </ng-select>
                    </div>
                </div>
                 <div class="row align-items-center mb-3">
                    <label class="control-label col-md-1" style="text-align: left;"></label>
                        <label class="form-label col-md-2 text-start fw-semibold">
                            Select Business Type
                        </label>
                    <div class="col-md-5">
                        <ng-select class="noFoundTextColor required2 clear-icon" placeholder="Select Business Type"
                                formControlName="bustyp" bindLabel="codeDesc" bindValue="codeId" [items]="generalMasterService.businessTypedata">
                            </ng-select>
                    </div>
                </div>
                 <div class="row align-items-center mb-3">
                     <label class="control-label col-md-1" style="text-align: left;"></label>
                        <label class="form-label col-md-2 text-start fw-semibold">
                           Loading By
                        </label>
                    <div class="col-md-5">
                         <ng-select class="noFoundTextColor required2 clear-icon" placeholder="Select Loading By" (change)="changeLoadingBy($event)"
                                formControlName="loadingBy" bindLabel="codeDesc" bindValue="codeId" [items]="generalMasterService.loadingData">
                            </ng-select>
                    </div>
                </div>
                 <div class="row align-items-center mb-3">
                     <label class="control-label col-md-1" style="text-align: left;"></label>
                        <label class="form-label col-md-2 text-start fw-semibold">
                            Charge type
                        </label>
                    <div class="col-md-5">
                         <ng-select class="noFoundTextColor required2 clear-icon" placeholder="Select Charge type" [readonly]="challanService.filterForm.value.loadingBy === 'XX9'"
                                formControlName="chrgType" bindLabel="codeDesc" bindValue="codeId" [items]="generalMasterService.chargeTypeData"
                                [ngClass]="{ 'border-danger': challanService.filterForm.get('chrgType')?.invalid  && challanService.filterForm.get('chrgType')?.touched }"
                                >
                            </ng-select>
                            <div class="text-danger text-start" *ngIf="challanService.filterForm.get('chrgType')?.hasError('required') && challanService.filterForm.get('chrgType')?.touched">
                                Charge Type is required
                            </div>
                    </div>
                </div>
                 <div class="row align-items-center mb-3">
                     <label class="control-label col-md-1" style="text-align: left;"></label>
                        <label class="form-label col-md-2 text-start fw-semibold">
                            Select Booked Type
                        </label>
                    <div class="col-md-5">
                         <ng-select class="noFoundTextColor required2 clear-icon" placeholder="Select Booked Type"
                                formControlName="BookedByType" bindLabel="text" bindValue="value" [items]="bookByTypeData" (change)="this.getBookedByData($event.value)">
                            </ng-select>
                    </div>
                </div>
                 <div class="row align-items-center mb-3">
                    <label class="control-label col-md-1" style="text-align: left;"></label>
                        <label class="form-label col-md-2 text-start fw-semibold">
                            Select Booked By
                        </label>
                    <div class="col-md-5">
                         <ng-select class="noFoundTextColor clear-icon"  [ngClass]="{ 'required2': challanService.filterForm.get('BookedByType')?.value === 'B'}" placeholder="Select Booked By"
                                formControlName="BookedBy" bindLabel="text" bindValue="value" [items]="bookByData">
                            </ng-select>
                    </div>
                </div>
                    <div class="row align-items-center mb-3" *ngIf="this.docketService.loginUserList.Type === '3'">
                        <label class="control-label col-md-1" style="text-align: left;"></label>
                        <label class="form-label col-md-2 text-start fw-semibold">
                            ODA type
                        </label>
                        <div class="col-md-5">
                            <ng-select class="noFoundTextColor clear-icon" placeholder="Select ODA type" formControlName="odaType"
                                bindLabel="text" bindValue="value" [items]="odaTypeList">
                            </ng-select>
                        </div>
                    </div>
                  <div class="row align-items-center mb-3">
                    <div class="col-md-3 text-start"> </div>
                    <div class="col-md-5 text-start">
                        OR
                    </div>
                </div>
                  <div class="row align-items-center mb-3">
                    <label class="control-label col-md-1" style="text-align: left;"></label>
                        <label class="form-label col-md-2 text-start fw-semibold">
                           CNote No.
                        </label>
                    <div class="col-md-5">
                        <input type="text" class="form-control" placeholder="CNote No." formControlName="docketList">
                    </div>
                </div>
 
                <div class="p-4 bg-light">
                    <div class="col-md-12 d-flex gap-2">
                        <div class="col-md-8">
                            <button type="button" class="btn background text-white btn-sm px-3" (click)="onSearch()"><i
                                    class="fas fa-search"></i>&nbsp;Search</button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        </div>
 
   </div>
