<div class="cnote-entry-container px-2">
    <!-- Header Bar -->
    <div class="text-white px-3 py-3 d-flex align-items-center fw-semibold background-color">
        <i class="fas fa-filter me-2"></i>
        FM Query
    </div>
    <form [formGroup]="filterForm">
        <div class="form-grid p-4">
            <div class="row pb-3">
                <div class="col-md-2 col-form-label text-end">DocType :</div>
                <div class="col-md-3">
                    <ng-select class="required2" placeholder="COD/DOD" [items]="DocTypelist" formControlName="DocType" bindLabel="text" bindValue="value" (change)="onChangeDocType($event)"
                        [ngClass]="{ 'border-danger': filterForm.get('DocType')?.invalid && filterForm.get('DocType')?.touched }"></ng-select>
                    <div class="text-danger text-start" *ngIf="filterForm.get('DocType')?.invalid && filterForm.get('DocType')?.touched">
                        This field is required.
                    </div>
                </div>
            </div>

            <div class="row pb-3">
                <div class="col-md-2 col-form-label text-end">Select Date :</div>
                <div class="col-md-3">
                    <ng-select class="required2" placeholder="Delivery Date" [items]="DateTypelist" formControlName="DT_TYPE" bindLabel="text" bindValue="value"
                        [ngClass]="{ 'border-danger': filterForm.get('DT_TYPE')?.invalid && filterForm.get('DT_TYPE')?.touched }"></ng-select>
                    <div class="text-danger text-start" *ngIf="filterForm.get('DT_TYPE')?.invalid && filterForm.get('DT_TYPE')?.touched">
                        This field is required.
                    </div>
                </div>

                <div class="col-md-2">
                    <div class="input-group shadow-sm rounded" (click)="dvr.toggle()">
                        <span class="input-group-text bg-white border-end-0 p-2">
                            <i class="fas fa-calendar-alt text-dark text-secondary"></i>
                        </span>
                        <input type="text" placeholder="Daterangepicker" class="form-control border-start-1 text-center line-height uppercase-none "
                            bsDaterangepicker #dvr="bsDaterangepicker" formControlName="dateRange" [class.disabled-input]="true"
                            [bsConfig]="{ ranges: commonService.ranges, rangeInputFormat: 'MMMM D, YYYY', containerClass: 'theme-dark-blue', dateInputFormat: 'MMMM D, YYYY'}" />
                    </div>
                </div>
            </div>
            <!-- Row 3 -->
            <div class="row pb-3">
                <div class="col-md-2 col-form-label text-end">Paybas :</div>
                <div class="col-md-3">
                    <ng-select class="required2" placeholder="Select Paybas" formControlName="Paybas" [items]="PayBsData" bindLabel="codeDesc" bindValue="codeId"
                        [ngClass]="{ 'border-danger': filterForm.get('Paybas')?.invalid && filterForm.get('Paybas')?.touched }"></ng-select>
                    <div class="text-danger text-start" *ngIf="filterForm.get('Paybas')?.invalid && filterForm.get('Paybas')?.touched">
                        This field is required.
                    </div>
                </div>
            </div>

            <!-- Row 4 -->
            <div class="row pb-3">
                <div class="col-md-2 col-form-label text-end">Document No :</div>
                <div class="col-md-3 d-flex align-items-center">
                    <input type="text" class="form-control" placeholder="Dockets" formControlName="Dockets">
                </div>
                <small class="ms-2 col-md-2 text-primary text-start col-form-label">[Seperated by Comma if multiple]</small>
            </div>
        </div>
    </form>

    <div class="d-flex justify-content-center bg-secondary-subtle p-4 gap-2">
        <button class="btn btn-success" (click)="goToForwardList()"> <i class="fas fa-check"></i> Get List</button>
    </div>
</div>
