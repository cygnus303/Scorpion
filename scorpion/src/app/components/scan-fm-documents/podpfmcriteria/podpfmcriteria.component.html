<div class="cnote-entry-container px-2">
    <!-- Header Bar -->
    <div class="text-white px-3 py-3 d-flex align-items-center fw-semibold background-color">
        <i class="fas fa-filter me-2"></i>
        POD PFM Uplaod
    </div>
    <form [formGroup]="podpFmCriteriaForm">
        <div class="form-grid p-4">
            <!-- Row 3 -->
            <div class="row pb-3">
                <div class="col-md-2 col-form-label text-end">Select Location :</div>
                <div class="col-md-3">
                    <div class="input-group shadow-sm rounded" (click)="dvr.toggle()">
                        <span class="input-group-text bg-white border-end-0 p-2">
                            <i class="fas fa-calendar-alt text-dark text-secondary"></i>
                        </span>
                        <input type="text" placeholder="Daterangepicker"
                            class="form-control border-start-1 text-center line-height uppercase-none "
                            bsDaterangepicker #dvr="bsDaterangepicker" [class.disabled-input]="true"
                            formControlName="dateRange"
                            [bsConfig]="{ ranges: commonService.ranges, rangeInputFormat: 'MMMM D, YYYY', containerClass: 'theme-dark-blue', dateInputFormat: 'MMMM D, YYYY'}" />
                    </div>
                </div>
            </div>

            <div class="row pb-3">
                <div class="col-md-2 col-form-label text-end">Select Location : </div>
                <div class="col-md-3">
                    <ng-select class="noFoundTextColor" placeholder="Enter Branch" formControlName="fromloc"
                        notFoundText="No matches found" (search)="scanFmDocumentsService.getLocationDetail($event)"
                        [notFoundText]="scanFmDocumentsService.nextLocationValue"
                        (open)="scanFmDocumentsService.resetNextLocationDropdown()">
                        <ng-option *ngFor="let item of scanFmDocumentsService.locationData" [value]="item.id">
                            <strong>{{ item.id }}</strong> : {{ item.text }}
                        </ng-option>
                    </ng-select>
                </div>
            </div>

        </div>
    </form>
    <div class="bg-secondary-subtle p-4 gap-2">
        <div class="row pb-3">
            <div class="col-md-4 col-form-label text-center">
                <button class="btn btn-success"> <i class="fas fa-search"></i> Get List</button>
            </div>
        </div>
    </div>



    <div class="cnote-entry-container mt-4">
        <!-- Header Bar -->
        <div class="text-white px-3 py-3 d-flex align-items-center justify-content-between fw-semibold background-color">
            <div>
                <i class="fas fa-list me-2"></i>
                POD PFM List
            </div>
            <button class="btn btn-success"> <i class="fas fa-list "></i>Download XLS</button>
        </div>
    </div>
