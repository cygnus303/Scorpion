<div class="cnote-entry-container px-2">
    <div class="text-white px-3 py-3 d-flex align-items-center fw-semibold background-color">
        <h5 class="mb-0">
            <i class="fas fa-edit me-2"></i> Edit PFM
        </h5>
    </div>
    <div class="m-4">
        <div class="col-3">
            <div class="row">
                <label class="col-sm-3 text-end fw-semibold">PFM :</label>
                <div class="col-sm-7 text-start fw-semibold">
                   {{this.fmNo}}
                </div>
            </div>
        </div>
    </div>

    <h3 class="pb-4 text-start appointment mt-5">Docket Details</h3>
<form [formGroup]="editMfform">
    <div class="col-md-4">
        <div class="form-group">
            <label class="control-label col-md-5">No Of Rows </label>
            <div class="col-md-7">
                <div class="input-group custom-input-group">
                    <input type="number" class="form-control rounded-0 rounded-start" min="1"
                        placeholder="Enter rows" formControlName="noOfRows"/>
                    <button type="button" class="btn btn-add text-light rounded-0 rounded-end" title="Add Row" (click)="addRows()">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="table-responsive p-3" style="max-width: 800px;">
        <table class="table table-bordered table-hover align-middle mb-0 ">
            <thead class="table-light text-center">
                <tr>
                    <th>Sr. No.</th>
                    <th>Docket</th>
                    <th>
                        <div style="color: Maroon; font-size: 14px; font-weight: bolder; text-decoration: none;"
                            class="cursor-pointer">X</div>
                    </th>
                </tr>
            </thead>
            <tbody formArrayName="dockets">
                <tr *ngFor="let row of dockets.controls; let i = index" [formGroupName]="i">
                    <td>{{ i + 1 }}</td>
                    <td><input class="form-control required2" formControlName="docket" placeholder="Enter Docket No"></td>
                    <td class="center">
                        <div style="color: Maroon; font-size: 14px; font-weight: bolder; text-decoration: none;" class="cursor-pointer" (click)="removeRow(i)">X</div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    </form>
</div>

<!-- Back Button -->
<div class="d-flex justify-content-center bg-secondary-subtle p-4 gap-2 mt-4">
    <button class="btn btn-secondary" (click)="goToBackList()">
        ← Back
    </button>
    <button class="btn btn-success" (click)="onSubmit()"> <i class="fas fa-check"></i> Submit</button>
</div>
