<ng-template #Templatepod>
    <div class="modal-header">
        <div class="d-flex align-items-center gap-3">
            <div class="pfm-icon fs-4 fw-bold" style="background:#e6f4ea;border:1px solid #82c995;">✓</div>
            <div>
                <div class="fw-bold fs-5">Acknowledge PFM</div>
                <div class="pfm-subtitle">Confirm acknowledgement of forwarded records</div>
            </div>
        </div>
        <button type="button" class="btn-close pfm-close" (click)="modalRef.hide()"></button>
    </div>
    <div class="modal-body" style="padding:20px 22px;gap:12px;">
        <div style="font-size:13px;color:var(--secondary);text-align:center;line-height:1.7;">
            You are about to mark the selected PFM record(s) as <strong
                style="color:#1a7f37;">Acknowledged</strong>.<br>
            This action confirms receipt of the forwarded POD documents.
        </div>
        <div
            style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);margin-top:4px;">
            Selected PFM(s):</div>
        <div class="d-flex flex-wrap gap-2 mt-3">
            <span *ngFor="let pfm of uniquePFMs" class="input-background-color px-4 py-2 rounded">
                {{ pfm }}
            </span>
        </div>

        <div class="form-group-input mb-2 mt-3">
            <label>Acknowledgement Date</label>
            <div class="input-group" (click)="dp.toggle(); $event.stopPropagation()">
                <input type="text" class="form-control input-background-color" #dp="bsDatepicker" bsDatepicker
                    [bsConfig]="{ containerClass: 'theme-dark-blue' , dateInputFormat: 'DD MMMM YYYY'}"
                    placeholder="Acknowledgement Date" [class.disabled-input]="true">
                <span class="input-group-text cursor-pointer">
                    <i class="fa fa-calendar"></i>
                </span>
            </div>
        </div>

        <!-- ── Remarks ── -->
        <div class="form-group-input mb-2 ">
            <label>Remarks</label>
            <textarea class="form-control-textarea input-background-color mb-2"
                placeholder="Optional acknowledgement remarks…"></textarea>
        </div>
    </div>
    <div class="modal-footer d-flex justify-content-end gap-3">
        <button type="button" class="btn btn-light px-4 py-2 rounded" (click)="modalRef.hide()">Cancel</button>
        <button type="button" class="btn btn-primary px-4 py-2 rounded"><span class="me-2 fs-5">✓</span> Confirm
            Acknowledge</button>
    </div>
</ng-template>
