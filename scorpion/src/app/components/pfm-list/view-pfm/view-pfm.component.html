<!-- ══ FORWARD PFM MODAL ══ -->
<ng-template #Templatepod>
    <div class="modal-header">
        <div class="d-flex align-items-center gap-3">
            <div class="pfm-icon fs-4 fw-bold" style="background:#e8f0fe;border:1px solid #aac4f5;">👁</div>
            <div>
                <div class="fw-bold fs-5">PFM/25/MUMBAI/000005</div>
                <div class="pfm-subtitle">Status: Acknowledged · 2 LR(s)</div>
            </div>
        </div>
        <button type="button" class="btn-close pfm-close" (click)="modalRef.hide()"></button>
    </div>

    <div class="modal-body p-4" style="padding:0;gap:0;">
        <div style="padding:16px 22px;border-bottom:1px solid var(--border-light);border-radius:8px;"
            class="input-background-color">
            <div class="row">
                <div class="col-3">
                    <label class="meta-label">PFM Number</label>
                    <div class="fw-bold text-info">PFM/25/MUMBAI/000001</div>
                </div>
                <div class="col-3">
                    <label class="meta-label">Branch</label>
                    <div class="fw-bold">MUMBAI</div>
                </div>
                <div class="col-3">
                    <label class="meta-label">Status</label>
                    <div class="fw-bold">Acknowledged</div>
                </div>
                <div class="col-3">
                    <label class="meta-label">Courier Date</label>
                    <div class="fw-bold">24-Mar-2026</div>
                </div>
            </div>
            <div class="row mt-2">
                <div class="col-3">
                    <label class="meta-label">Courier No</label>
                    <div class="fw-bold">123456789</div>
                </div>
                <div class="col-3">
                    <label class="meta-label">Courier Company</label>
                    <div class="fw-bold">FedEx</div>
                </div>
                <div class="col-3">
                    <label class="meta-label">Forwarded To</label>
                    <div class="fw-bold">HQTR</div>
                </div>
                <div class="col-3">
                    <label class="meta-label">Acknowledged Date</label>
                    <div class="fw-bold">28 Jun 2025</div>
                </div>
            </div>
        </div>

        <!-- ── LR Listing ── -->
        <div class="mt-3">
            <div class="d-flex align-items-center justify-content-between mb-2">
                <div
                    style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);">
                    Lorry Receipts</div>
            </div>
            <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden; ">
                <table style="width:100%;border-collapse:collapse;font-size:13px;">
                    <thead class="input-background-color">
                        <tr style="background:var(--surface2);border-bottom:1px solid var(--border);">
                            <th
                                style="padding:9px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);text-align:center;">
                                #</th>
                            <th
                                style="padding:9px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);text-align:left;">
                                LR No</th>
                            <th
                                style="padding:9px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);text-align:left;">
                                LR Date</th>
                            <th
                                style="padding:9px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);text-align:left;">
                                Origin</th>
                            <th
                                style="padding:9px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-muted);text-align:left;">
                                Destination</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr style="border-bottom: 1px solid var(--border-light); background: var(--accent-glow);">
                            <td style="text-align:center;padding:9px 12px;">
                                1
                            </td>
                            <td style="padding:9px 12px;"><span class="lr-no">LR-2025-00461</span></td>
                            <td style="padding:9px 12px;"><span class="lr-date">10 Jun 2025</span></td>
                            <td style="padding:9px 12px;">
                                <div class="location-cell">
                                    <div class="loc-dot origin"></div>Bangalore
                                </div>
                            </td>
                            <td style="padding:9px 12px;">
                                <div class="location-cell">
                                    <div class="loc-dot dest"></div>Chennai
                                </div>
                            </td>
                        </tr>
                        <tr id="fwd-row-5"
                            style="border-bottom: 1px solid var(--border-light); background: var(--accent-glow);">
                            <td style="text-align:center;padding:9px 12px;">
                                2
                            </td>
                            <td style="padding:9px 12px;"><span class="lr-no">LR-2025-00478</span></td>
                            <td style="padding:9px 12px;"><span class="lr-date">11 Jun 2025</span></td>
                            <td style="padding:9px 12px;">
                                <div class="location-cell">
                                    <div class="loc-dot origin"></div>Hyderabad
                                </div>
                            </td>
                            <td style="padding:9px 12px;">
                                <div class="location-cell">
                                    <div class="loc-dot dest"></div>Nagpur
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="modal-footer d-flex justify-content-end">
        <button type="button" class="btn btn-light px-4 py-2 rounded" (click)="modalRef.hide()">Cancel</button>
    </div>
</ng-template>
