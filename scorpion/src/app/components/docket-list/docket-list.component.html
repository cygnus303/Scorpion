<div class="alert alert-danger display-hide d-flex justify-content-between" *ngIf="docketService.submitErrorMsg">
    <ul class="mb-0" style="list-style-type: disc; padding-left: 20px;">
    <li *ngFor="let err of docketService.submitErrorMsg">
      {{ err }}
    </li>
  </ul>
</div>

<div class="mt-0">
    <basic-details></basic-details>
</div>
<div class="p-2">
    <consignor-detail></consignor-detail>
</div>
<div class="p-2">
    <invoice-details></invoice-details>
</div>
<div class="p-2 mb-4">
    <freight-details></freight-details>
</div>
<div class="form-actions fluid">
    <div class="col-md-12 d-flex justify-content-center gap-2">
        <a class="btn btn-light default"> <i class="fas fa-sync"></i>&nbsp;Reset</a>
    <button type="submit" class="btn btn-success btn-sm px-3"  *ngIf="(!(apiLoading.loading$ | async) && !docketService.isContarctService)" 
          (click)="onSubmit()" [disabled]="!docketService.isSubmiting || isRedirect">
        <ng-container>
            <i class="fas fa-check"></i>&nbsp;Submit
        </ng-container>
        <!-- <ng-container *ngIf="isSubmitting">
            <i class="fas fa-spinner fa-spin"></i>&nbsp;Saving...
        </ng-container> -->
    </button>
    <!-- <div *ngIf="docketService.isContarctService" class="d-flex align-items-center text-danger fw-semibold">Please Enter Vaild Data</div> -->
    <div *ngIf="(apiLoading.loading$ | async)" class="d-flex align-items-center text-danger fw-semibold">Calculating charges, please wait…</div>
    </div>
</div>

<div *ngIf="isSubmitting" class="loading-overlay">
  <div class="spinner-container">
    <i class="fas fa-spinner fa-spin custom-spinner"></i>
    <div class="mt-3 custom-text">Submitting...</div>
  </div>
</div>

<!-- PRQ Success Modal — SweetAlert Style UI -->
<div *ngIf="showPRQSuccessModal"
     class="modal d-block fade show"
     tabindex="-1"
     style="background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(3px);">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 16px; overflow: hidden; padding: 10px;">
      
      <!-- Close Button at top right (without header) -->
      <button type="button" class="btn-close position-absolute top-0 end-0 m-3" style="font-size: 14px; z-index: 10;" (click)="closePRQSuccess()"></button>

      <div class="modal-body text-center px-4 pt-5 pb-2">
        
        <!-- SweetAlert Style Animated/Large Icon -->
        <div class="mx-auto d-flex align-items-center justify-content-center rounded-circle mb-4 shadow-sm" 
             style="width: 85px; height: 85px; background-color: #f0fdf4; border: 4px solid #bbf7d0;">
          <i class="fas fa-check" style="color: #22c55e; font-size: 42px;"></i>
        </div>
        
        <h4 class="fw-bold mb-3" style="font-size: 26px; color: #1f2937;">Success!</h4>
        
        <p class="text-muted mb-2" style="font-size: 15px; color: #4b5563;">
          CNote No. <strong class="text-dark">{{ prqSuccessResult?.dockNo }}</strong> has been generated successfully.
        </p>
        <p class="text-muted mb-4" style="font-size: 15px; color: #4b5563;">
          It has been booked for PRQ <strong class="text-dark">{{ docketService.loginUserList.prqData?.PRQNo }}</strong>.
        </p>

        <!-- Box for All CNotes -->
        <div class="mx-auto text-center mb-4" style="max-width: 100%; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px;">
          <div class="fw-semibold" style="color: #64748b; font-size: 13px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px;">
            All CNotes on this PRQ (1)
          </div>
          <div style="color: #0f172a; font-size: 15px; font-weight: 600;">
            {{ prqSuccessResult?.dockNo }} 
          </div>
        </div>

      </div>

      <!-- Footer -->
      <div class="modal-footer border-0 d-flex justify-content-center gap-3 pb-4 pt-0">
        <button type="button" class="btn btn-light fw-medium px-4 py-2" 
                style="border-radius: 8px; font-size: 15px; color: #4b5563; background-color: #f3f4f6; border: none; transition: all 0.2s;" 
                (click)="closePRQSuccess()">
          Close
        </button>
        <button type="button" class="btn text-white fw-medium px-4 py-2 shadow-sm" 
                style="background-color: #22c55e; border-radius: 8px; font-size: 15px; border: none; transition: all 0.2s;" 
                (click)="generateMoreLR()">
          <i class="fas fa-plus me-1"></i> Generate More LR
        </button>
      </div>

    </div>
  </div>
</div>
