<!-- Box Skeleton Loader -->
<div class="documents-tab-container placeholder-glow p-2" *ngIf="isLoading">
  <div *ngFor="let section of [1,2]" class="mb-4">
    <!-- Skeleton Section Header -->
    <div class="mt-3 mb-2 d-flex align-items-center justify-content-center">
      <span class="placeholder bg-secondary bg-opacity-25 rounded col-3" style="height: 14px;"></span>
    </div>
    <!-- Skeleton Cards -->
    <div class="d-flex flex-column gap-2">
      <div *ngFor="let item of [1,2,3]" class="card p-3 border border-light-subtle rounded-3 shadow-xs d-flex flex-row align-items-center justify-content-between"
        style="background-color: #f8fafc !important; border-color: #cbd5e1 !important; margin-bottom: 2px;">
        <div class="d-flex align-items-center gap-3 w-75">
          <div class="bg-secondary bg-opacity-25 rounded-2 placeholder" style="width: 42px; height: 42px;"></div>
          <div class="d-flex flex-column w-100 gap-2">
            <div class="d-flex gap-2 w-100">
              <span class="placeholder bg-secondary bg-opacity-25 rounded col-4"></span>
              <span class="placeholder bg-secondary bg-opacity-25 rounded col-3"></span>
            </div>
            <span class="placeholder bg-secondary bg-opacity-25 rounded col-7"></span>
          </div>
        </div>
        <div class="w-25 text-end">
          <span class="placeholder bg-secondary bg-opacity-25 rounded-pill" style="width: 70px; height: 26px;"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="documents-tab-container" *ngIf="!isLoading && documentData">

  <!-- Reusable Document Card Template -->
  <ng-template #docCard let-icon="icon" let-name="name" let-docNo="docNo" let-info="info" let-status="status" let-raw="raw">
    <div class="card p-3 border border-light-subtle rounded-3 shadow-xs d-flex flex-row align-items-center justify-content-between"
      style="background-color: #f8fafc !important; border-color: #cbd5e1 !important; margin-bottom: 2px; transition: all 0.2s;">
      
      <!-- Left Side: Icon and Details -->
      <div class="d-flex align-items-center gap-3">
        <div class="d-flex align-items-center justify-content-center bg-white border border-light-subtle rounded-2"
          style="width: 46px; height: 46px; min-width: 46px; font-size: 32px; border-color: #cbd5e1 !important; line-height: 1; display: flex; transform: scale(1.2); margin-right: 4px;">
          {{ icon }}
        </div>
        <div class="d-flex flex-column ms-1">
          <div class="d-flex align-items-baseline gap-2 flex-wrap">
            <span class="fw-bold text-dark" style="font-size: 13.5px; color: #1e293b !important;">{{ name }}</span>
            <span class="text-muted font-monospace" style="font-size: 11px; font-weight: 500;">{{ docNo }}</span>
          </div>
          <div class="text-muted mt-1" style="font-size: 11.5px; font-weight: 400; color: #64748b !important;">
            {{ info }}
          </div>
        </div>
      </div>

      <!-- Right Side: Status Badge or Action Button -->
      <div>
        <ng-container *ngIf="status === 'Done'">
          <span class="badge rounded-pill fw-medium d-inline-flex align-items-center gap-1"
            style="background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; padding: 6px 12px; font-size: 11.5px;">
            <span class="d-flex align-items-center justify-content-center text-white rounded-circle"
              style="background-color: #166534; width: 14px; height: 14px; font-size: 8px;">✔</span>
            Done
          </span>
        </ng-container>
        <ng-container *ngIf="status === 'Pending'">
          <span class="badge rounded-pill fw-medium d-inline-flex align-items-center gap-1"
            style="background-color: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; padding: 6px 12px; font-size: 11.5px;">
            <span>⏳</span> Pending
          </span>
        </ng-container>
        <ng-container *ngIf="status === 'Active'">
          <span class="badge rounded-pill fw-medium d-inline-flex align-items-center gap-1"
            style="background-color: #f0f9ff; color: #0369a1; border: 1px solid #bae6fd; padding: 6px 12px; font-size: 11.5px;">
            <span>⚡</span> Active
          </span>
        </ng-container>
        <ng-container *ngIf="status === 'View'">
          <button (click)="onViewClick(raw)" class="btn btn-sm fw-bold d-inline-flex align-items-center gap-1"
            style="background-color: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; font-size: 11.5px; padding: 5px 14px; border-radius: 6px; transition: all 0.2s;"
            onmouseover="this.style.backgroundColor='#dbeafe'" onmouseout="this.style.backgroundColor='#eff6ff'">
            <span>↓</span> <span>View</span>
          </button>
        </ng-container>
      </div>
    </div>
  </ng-template>

  <!-- 1. ORIGIN BRANCH DOCUMENTS -->
  <div class="mb-4">
    <div class="d-flex align-items-center justify-content-center mt-3 mb-3">
      <div style="flex: 1; height: 1px; background-color: #e2e8f0;"></div>
      <div class="px-3 text-muted" style="font-size: 11px; font-weight: 700; color: #64748b; letter-spacing: 0.5px;">
        📦 ORIGIN BRANCH DOCUMENTS
      </div>
      <div style="flex: 1; height: 1px; background-color: #e2e8f0;"></div>
    </div>
    <div class="d-flex flex-column gap-2">
      <!-- PRQ -->
      <ng-container *ngFor="let prq of documentData?.prqDetails">
        <ng-container *ngTemplateOutlet="docCard; context: { icon: '📱', name: 'Pickup Request', docNo: prq.prqNo || 'N/A', info: (prq.prqDate || '') + ' — Agent: ' + (prq.agentName || 'N/A'), status: prq.prqStatus || 'Done' }"></ng-container>
      </ng-container>
      
      <!-- LR -->
      <ng-container *ngFor="let lr of documentData?.lrDetails">
        <ng-container *ngTemplateOutlet="docCard; context: { icon: '📋', name: 'Lorry Receipt', docNo: 'LR-' + (lr.dockNo || 'N/A'), info: (lr.lrDate || '') + ' — ' + (lr.locations || 'N/A'), status: 'View', raw: lr.dockNo }"></ng-container>
      </ng-container>
      
      <!-- PRS -->
      <ng-container *ngFor="let prs of documentData?.prsDetails">
        <ng-container *ngTemplateOutlet="docCard; context: { icon: '📝', name: 'Pickup Run Sheet', docNo: prs.prsNo || 'N/A', info: 'Agent: ' + (prs.agentName || 'N/A') + ' — Commission: ' + (prs.commisionPerkg || 0) + ' (Per Kg)', status: prs.prsStatus || 'Done' }"></ng-container>
      </ng-container>
      
      <!-- Loading HCC -->
      <ng-container *ngFor="let hcc of documentData?.loadingHccDetails">
        <ng-container *ngTemplateOutlet="docCard; context: { icon: '📜', name: 'HCC-1 Loading @ Pickup', docNo: hcc.hcC_1_LoadingHCNo || 'N/A', info: (hcc.agentName || 'N/A') + ' Reimbursement — ₹ ' + (hcc.reimbursementAmt || 0), status: 'Done' }"></ng-container>
      </ng-container>

      <!-- Unloading HCC -->
      <ng-container *ngFor="let hcc of documentData?.unLoadingHccDetails">
        <ng-container *ngTemplateOutlet="docCard; context: { icon: '📜', name: 'HCC-2 Unloading @ Branch', docNo: hcc.hcC_2_UnLoadingHCNo || 'N/A', info: 'Labour Vendor — ₹ ' + (hcc.vendorLabour || 0), status: 'Done' }"></ng-container>
      </ng-container>

      <!-- LS -->
      <ng-container *ngFor="let ls of documentData?.lsDetails">
        <ng-container *ngTemplateOutlet="docCard; context: { icon: '📋', name: 'Loading Sheet', docNo: ls.lsNo || 'N/A', info: (ls.vehicleNo || 'N/A') + ' — ' + (ls.driverName || 'N/A'), status: 'Done' }"></ng-container>
      </ng-container>

      <!-- LS Loading HCC -->
      <ng-container *ngFor="let hcc of documentData?.lsLoadingHccDetails">
        <ng-container *ngTemplateOutlet="docCard; context: { icon: '📜', name: 'HCC-3 Loading → Hub', docNo: hcc.hcC_3_LoadingHccNo || 'N/A', info: 'Loader Vendor — ₹ ' + (hcc.loaderVendor || 0), status: 'Done' }"></ng-container>
      </ng-container>

      <!-- Manifest + THC -->
      <ng-container *ngFor="let mf of documentData?.mfDetails">
        <ng-container *ngTemplateOutlet="docCard; context: { icon: '📦', name: 'Manifest + THC', docNo: (mf.thcNo && mf.thcNo.trim() !== '') ? ((mf.mfNo || '') + ' + ' + mf.thcNo) : (mf.mfNo || 'N/A'), info: 'Vehicle: ' + (mf.vehicleNo || 'N/A'), status: 'Done' }"></ng-container>
      </ng-container>
    </div>
  </div>

  <!-- 2. HUB & TRANSIT DOCUMENTS (STATIC) -->
  <div class="mb-4">
    <div class="d-flex align-items-center justify-content-center mt-3 mb-3">
      <div style="flex: 1; height: 1px; background-color: #e2e8f0;"></div>
      <div class="px-3 text-muted" style="font-size: 11px; font-weight: 700; color: #64748b; letter-spacing: 0.5px;">
        🏭 HUB & TRANSIT DOCUMENTS
      </div>
      <div style="flex: 1; height: 1px; background-color: #e2e8f0;"></div>
    </div>
    <div class="d-flex flex-column gap-2">
      <ng-container *ngTemplateOutlet="docCard; context: { icon: '📦', name: 'Hub Manifest + THC', docNo: 'MF/MAAHUB/2526/000072 + THC/MAAHUB/2526/000048', info: 'Vehicle: AIR-IXC-2604-03 (Air Cargo) — Air Cargo — IndiGo Freight', status: 'Done' }"></ng-container>
      <ng-container *ngTemplateOutlet="docCard; context: { icon: '📜', name: 'HCC-4 Unloading @ Origin Hub', docNo: 'HCC/MAAHUB/2526/Auto', info: 'Hub Labour — ₹ 160', status: 'Done' }"></ng-container>
      <ng-container *ngTemplateOutlet="docCard; context: { icon: '📜', name: 'HCC-6 Unloading @ Trans Hub', docNo: 'HCC/NGPHUB/2526/Auto', info: '₹ 290', status: 'Active' }"></ng-container>
    </div>
  </div>

  <!-- 3. DELIVERY DOCUMENTS -->
  <div class="mb-4">
    <div class="d-flex align-items-center justify-content-center mt-3 mb-3">
      <div style="flex: 1; height: 1px; background-color: #e2e8f0;"></div>
      <div class="px-3 text-muted" style="font-size: 11px; font-weight: 700; color: #64748b; letter-spacing: 0.5px;">
        🏠 DELIVERY DOCUMENTS
      </div>
      <div style="flex: 1; height: 1px; background-color: #e2e8f0;"></div>
    </div>
    <div class="d-flex flex-column gap-2">
      <!-- DRS -->
      <ng-container *ngIf="documentData?.drsStatusResponse?.length > 0; else noDrs">
        <ng-container *ngFor="let drs of documentData?.drsStatusResponse">
          <ng-container *ngTemplateOutlet="docCard; context: { icon: '🛵', name: 'Delivery Run Sheet', docNo: drs.drsNo || 'DRS — Pending', info: drs.drsNo ? 'Delivery Agent Assigned' : 'To be generated at destination branch', status: drs.drsNo ? (drs.prsStatus || 'Done') : 'Pending' }"></ng-container>
        </ng-container>
      </ng-container>
      <ng-template #noDrs>
        <ng-container *ngTemplateOutlet="docCard; context: { icon: '🛵', name: 'Delivery Run Sheet', docNo: 'DRS — Pending', info: 'To be generated at destination branch', status: 'Pending' }"></ng-container>
      </ng-template>

      <!-- POD -->
      <ng-container *ngIf="documentData?.podStatusResponse?.length > 0; else noPod">
        <ng-container *ngFor="let pod of documentData?.podStatusResponse">
          <ng-container *ngTemplateOutlet="docCard; context: { icon: '📷', name: 'POD — Proof of Delivery', docNo: pod.podNo || 'Awaiting delivery', info: pod.podNo ? 'Uploaded' : 'Awaiting delivery', status: pod.podNo ? 'Done' : 'Pending' }"></ng-container>
        </ng-container>
      </ng-container>
      <ng-template #noPod>
        <ng-container *ngTemplateOutlet="docCard; context: { icon: '📷', name: 'POD — Proof of Delivery', docNo: 'Awaiting delivery', info: '', status: 'Pending' }"></ng-container>
      </ng-template>

      <!-- PFM -->
      <ng-container *ngIf="documentData?.pfmStatusResponse?.length > 0; else noPfm">
        <ng-container *ngFor="let pfm of documentData?.pfmStatusResponse">
          <ng-container *ngTemplateOutlet="docCard; context: { icon: '📤', name: 'POD Forwarding Module', docNo: pfm.pfmNo || 'PFM — Pending', info: pfm.pfmStatus || 'Will be prepared after POD upload', status: pfm.pfmNo ? 'Done' : 'Pending' }"></ng-container>
        </ng-container>
      </ng-container>
      <ng-template #noPfm>
        <ng-container *ngTemplateOutlet="docCard; context: { icon: '📤', name: 'POD Forwarding Module', docNo: 'PFM — Pending', info: 'Will be prepared after POD upload', status: 'Pending' }"></ng-container>
      </ng-template>
    </div>
  </div>

  <!-- 4. STATUTORY -->
  <div class="mb-4">
    <div class="d-flex align-items-center justify-content-center mt-3 mb-3">
      <div style="flex: 1; height: 1px; background-color: #e2e8f0;"></div>
      <div class="px-3 text-muted" style="font-size: 11px; font-weight: 700; color: #64748b; letter-spacing: 0.5px;">
        📄 STATUTORY
      </div>
      <div style="flex: 1; height: 1px; background-color: #e2e8f0;"></div>
    </div>
    <div class="d-flex flex-column gap-2">
      <ng-container *ngIf="documentData?.statutoryResponse?.length > 0; else noStat">
        <ng-container *ngFor="let stat of documentData?.statutoryResponse">
          <ng-container *ngTemplateOutlet="docCard; context: { icon: '📜', name: 'E-Way Bill', docNo: stat.ewayBillNo || 'E-Way Bill', info: stat.ewayValidTill ? ('Valid Till — ' + stat.ewayValidTill) : '', status: 'View' }"></ng-container>
        </ng-container>
      </ng-container>
      <ng-template #noStat>
        <ng-container *ngTemplateOutlet="docCard; context: { icon: '📜', name: 'E-Way Bill', docNo: '', info: '', status: 'View' }"></ng-container>
      </ng-template>
    </div>
    </div>
  </div>


<!-- Lr View Modal Component -->
<app-lr-view #LrViewComponent></app-lr-view>
