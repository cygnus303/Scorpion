
<div class="cnote-entry-container m-4">
    <div class="text-white px-3 py-3 d-flex align-items-center fw-semibold background-color">
    <i class="fa fa-edit me-2"></i>
    Vendor Contract Profile
  </div>
    <div class="form-grid p-4">
        <form [formGroup]="vendorContractService.vendorProfileForm">
            <div class="row mb-3">
                <div class="col-md-4">
                    <div class="row">
                        <label class="col-md-5 col-form-label text-end">Contract Code</label>
                        <div class="col-md-7">
                            <input type="text" class="form-control " placeholder="System Generated" formControlName="CONTRACTCD" readonly>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="row">
                        <label class="col-md-5 col-form-label text-end">Vendor Name</label>
                        <div class="col-md-7">
                            <input type="text" class="form-control " placeholder="Vendor Name" formControlName="VendorName" readonly/>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="row">
                        <label class="col-md-5 col-form-label text-end">Vendor Type</label>
                        <div class="col-md-7">
                            <input type="text" class="form-control " placeholder="Vendor Type" formControlName="VendorTypeName" readonly/>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4">
                    <div class="row">
                        <label class="col-md-5 col-form-label text-end">Contract Date</label>
                        <div class="col-md-7">
                            <div class="input-group" (click)="cd.toggle(); $event.stopPropagation()">
                                <input type="text" class="form-control required2" required placeholder="Contract Date" formControlName="ContractDt"
                                    #cd="bsDatepicker" bsDatepicker [bsValue]="docketService.bsValue" [class.disabled-input]="true"
                                    [bsConfig]="{ containerClass: 'theme-dark-blue' , dateInputFormat: 'DD MMM YYYY'}" 
                                     [ngClass]="{ 'border-danger': vendorContractService.vendorProfileForm.get('ContractDt')?.invalid  && vendorContractService.vendorProfileForm.get('ContractDt')?.touched}"/>
                                <span class="input-group-text cursor-pointer">
                                    <i class="fa fa-calendar"></i>
                                </span>
                            </div>
                            <div *ngIf="vendorContractService.vendorProfileForm.get('ContractDt')?.invalid && vendorContractService.vendorProfileForm.get('ContractDt')?.touched"
                                class="text-danger text-start">
                                <small *ngIf="vendorContractService.vendorProfileForm.get('ContractDt')?.hasError('required')">Contract Date is required.</small>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="row">
                        <label class="col-md-5 col-form-label text-end">Effective From Date</label>
                        <div class="col-md-7">
                            <div class="input-group" (click)="efd.toggle(); $event.stopPropagation()">
                                <input class="form-control required2" required placeholder="Effective From Date" [class.disabled-input]="true"
                                    formControlName="Start_Dt" #efd="bsDatepicker" bsDatepicker [bsValue]="docketService.bsValue"
                                    [bsConfig]="{ containerClass: 'theme-dark-blue' , dateInputFormat: 'DD MMM YYYY'}" 
                                     [ngClass]="{ 'border-danger': vendorContractService.vendorProfileForm.get('Start_Dt')?.invalid  && vendorContractService.vendorProfileForm.get('Start_Dt')?.touched}"/>
                                <span class="input-group-text cursor-pointer">
                                    <i class="fa fa-calendar"></i>
                                </span>
                            </div>
                            <div *ngIf="vendorContractService.vendorProfileForm.get('Start_Dt')?.invalid && vendorContractService.vendorProfileForm.get('Start_Dt')?.touched"
                                class="text-danger text-start">
                                <small *ngIf="vendorContractService.vendorProfileForm.get('Start_Dt')?.hasError('required')">Effective From Date is required.</small>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="row">
                        <label class="col-md-5 col-form-label text-end">Valid Until</label>
                        <div class="col-md-7">
                            <div class="input-group" (click)="dp.toggle(); $event.stopPropagation()">
                                <input type="text" class="form-control uppercase-none required2" placeholder="Valid Until" required formControlName="Valid_uptodt"
                                    [class.disabled-input]="true" 
                                    #dp="bsDatepicker" bsDatepicker [bsValue]="docketService.bsValue"
                                    [bsConfig]="{ containerClass: 'theme-dark-blue' , dateInputFormat: 'DD MMM YYYY'}" 
                                     [ngClass]="{ 'border-danger': vendorContractService.vendorProfileForm.get('Valid_uptodt')?.invalid  && vendorContractService.vendorProfileForm.get('Valid_uptodt')?.touched}">
                                <span class="input-group-text cursor-pointer" >
                                    <i class="fa fa-calendar"></i>
                                </span>
                            </div>
                            <div *ngIf="vendorContractService.vendorProfileForm.get('Valid_uptodt')?.invalid && vendorContractService.vendorProfileForm.get('Valid_uptodt')?.touched"
                                class="text-danger text-start">
                                <small *ngIf="vendorContractService.vendorProfileForm.get('Valid_uptodt')?.hasError('required')">Valid Until is required.</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4 ">
                    <div class="row">
                        <label class="col-md-5 col-form-label text-end">Contract Location</label>
                        <div class="col-md-7">
                            <ng-select class="noFoundTextColor clear-icon" placeholder="Contract Signing Location"
                                formControlName="Contract_loccode" notFoundText="No matches found"
                                (search)="scanFmDocumentsService.getLocationDetail($event)"
                                [notFoundText]="scanFmDocumentsService.nextLocationValue"
                                (open)="scanFmDocumentsService.resetNextLocationDropdown()">
                                <ng-option *ngFor="let item of scanFmDocumentsService.locationData" [value]="item.id">
                                    <strong>{{ item.id }}</strong> : {{ item.text }}
                                </ng-option>
                            </ng-select>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="row">           
                        <label class="col-md-5 col-form-label text-end">Vendor Representative</label>
                        <div class="col-md-7">
                            <input type="text" class="form-control " placeholder="Vendor Representative" formControlName="VendorPerName"/>

                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="row">
                        <label class="col-md-5 col-form-label text-end">Designation</label>
                        <div class="col-md-7">
                            <div class="input-group">
                                <input type="text" class="form-control" placeholder="Vendor Designation" formControlName="VendorPerDesg">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4">
                    <div class="row">
                        <label class="col-md-5 col-form-label text-end">Employee Name</label>
                        <div class="col-md-7">
                            <input type="text" class="form-control " placeholder="Company employee name" formControlName="CompEmpName"/>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="row">
                        <label class="col-md-5 col-form-label text-end">Vendor Witness</label>
                        <div class="col-md-7">
                            <input type="text" class="form-control " placeholder="Vendor Witness" formControlName="VendorWitness"/>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 ">
                    <div class="row">
                        <label class="col-md-5 col-form-label text-end">Designation</label>
                        <div class="col-md-7">
                            <div class="input-group">
                                <input type="text" class="form-control" placeholder="Employee Designation" formControlName="CompEmpDesg">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4">
                    <div class="row"><label class="col-md-5 col-form-label text-end">Vendor Address</label>
                        <div class="col-md-7">
                            <input type="text" class="form-control " placeholder="Vendor Address" formControlName="Vendor_Address"/>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 ">
                    <div class="row"><label class="col-md-5 col-form-label text-end">Company Witness</label>
                        <div class="col-md-7">
                            <input type="text" class="form-control " placeholder="Company Witness" formControlName="CompWitness"/>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="row">
                        <label class="col-md-5 col-form-label text-end">City- Pin</label>
                        <div class="col-md-7">
                            <div class="input-group gap-2">
                                <input type="text" class="form-control" placeholder="Vendor City" formControlName="VendorCity">
                                <input type="text" class="form-control" placeholder="Vendor Pin" formControlName="VendorPin"  (keypress)="($event.charCode >= 48 && $event.charCode <= 57) ? true : $event.preventDefault()"  maxlength="6">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4 ">
                    <div class="row"><label class="col-md-5 col-form-label text-end">TDS Applicable</label>
                        <div class="col-md-7 text-start">
                            <input type="checkbox" formControlName="TDSAppl_YN"/>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 ">
                    <div class="row"><label class="col-md-5 col-form-label text-end">Vendor Category</label>
                        <div class="col-md-7">
                            <ng-select class="noFoundTextColor required2" formControlName="VendorCategory" required [items]="vendorCategoryList" bindLabel="text" bindValue="value"
                                placeholder="Select Vendor Category"   [ngClass]="{ 'border-danger': vendorContractService.vendorProfileForm.get('VendorCategory')?.invalid  && vendorContractService.vendorProfileForm.get('VendorCategory')?.touched}"></ng-select>
                                <div *ngIf="vendorContractService.vendorProfileForm.get('VendorCategory')?.invalid && vendorContractService.vendorProfileForm.get('VendorCategory')?.touched" class="text-danger text-start">
                                    <small *ngIf="vendorContractService.vendorProfileForm.get('VendorCategory')?.hasError('required')">Vendor Category is required.</small>
                                </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="row">
                        <label class="col-md-5 col-form-label text-end">Contract Category</label>
                        <div class="col-md-7">
                            <ng-select class="noFoundTextColor required2" formControlName="VendorContractCat" required
                                [items]="vendorCategoryList" bindLabel="text" bindValue="value" placeholder="Select Contract Category"
                                [ngClass]="{ 'border-danger': vendorContractService.vendorProfileForm.get('VendorContractCat')?.invalid  && vendorContractService.vendorProfileForm.get('VendorContractCat')?.touched}"></ng-select>
                            <div *ngIf="vendorContractService.vendorProfileForm.get('VendorContractCat')?.invalid && vendorContractService.vendorProfileForm.get('VendorContractCat')?.touched" class="text-danger text-start">
                                <small *ngIf="vendorContractService.vendorProfileForm.get('VendorContractCat')?.hasError('required')">Contract Category is
                                    required.</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4 ">
                    <div class="row"><label class="col-md-5 col-form-label text-end">TDS Rate</label>
                        <div class="col-md-7">
                            <input type="text" class="form-control " placeholder="Select TDS Rate" formControlName="TDS_Rate" />
                        </div>
                    </div>
                </div>
                <div class="col-md-4 ">
                    <div class="row"><label class="col-md-5 col-form-label text-end">Deposit Cheque(s)</label>
                        <div class="col-md-7">
                            <input type="text" class="form-control " placeholder="Security Deposit Cheque(s)"  formControlName="Security_deposit_chq" />
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="row">
                        <label class="col-md-5 col-form-label text-end">Payment Interval</label>
                        <div class="col-md-7">
                            <div class="input-group">
                                <ng-select class="noFoundTextColor" formControlName="Payment_interval"
                                [items]="paymentIntervalList" bindLabel="text" bindValue="value" placeholder="Select Payment Interval" ></ng-select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4 ">
                    <div class="row"><label class="col-md-5 col-form-label text-end">Deposit Date</label>
                        <div class="col-md-7">
                             <div class="input-group" (click)="dp1.toggle(); $event.stopPropagation()">
                                <input type="text" class="form-control uppercase-none required2" placeholder="Deposit Date" required formControlName="Security_deposit_date"
                                    [class.disabled-input]="true"
                                    #dp1="bsDatepicker" bsDatepicker [bsValue]="docketService.bsValue"
                                    [bsConfig]="{ containerClass: 'theme-dark-blue' , dateInputFormat: 'DD MMMM YYYY'}"
                                     [ngClass]="{ 'border-danger': vendorContractService.vendorProfileForm.get('Security_deposit_date')?.invalid  && vendorContractService.vendorProfileForm.get('Security_deposit_date')?.touched}" >
                                <span class="input-group-text cursor-pointer" >
                                    <i class="fa fa-calendar"></i>
                                </span>
                            </div>
                            <div *ngIf="vendorContractService.vendorProfileForm.get('Security_deposit_date')?.invalid && vendorContractService.vendorProfileForm.get('Security_deposit_date')?.touched"
                                class="text-danger text-start">
                                <small *ngIf="vendorContractService.vendorProfileForm.get('Security_deposit_date')?.hasError('required')">Deposit Date is required.</small>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 ">
                    <div class="row"><label class="col-md-5 col-form-label text-end">Deposit Amount</label>
                        <div class="col-md-7">
                            <input class="form-control" placeholder="Deposit Amount" formControlName="Security_deposit_Amt">
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="row">
                        <label class="col-md-5 col-form-label text-end">Payment Basis</label>
                        <div class="col-md-7">
                            <div class="input-group">
                                 <ng-select class="noFoundTextColor" formControlName="Payment_Basis"
                                [items]="paymentBasisList" bindLabel="text" bindValue="value" placeholder="Payment Basis" ></ng-select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4 ">
                    <div class="row"><label class="col-md-5 col-form-label text-end">Payment Location</label>
                        <div class="col-md-7">
                             <ng-select class="noFoundTextColor clear-icon" placeholder="Payment Location"
                                formControlName="Payment_loc" notFoundText="No matches found"
                                (search)="scanFmDocumentsService.getLocationDetail($event)"
                                [notFoundText]="scanFmDocumentsService.nextLocationValue"
                                (open)="scanFmDocumentsService.resetNextLocationDropdown()">
                                <ng-option *ngFor="let item of scanFmDocumentsService.locationData" [value]="item.id">
                                    <strong>{{ item.id }}</strong> : {{ item.text }}
                                </ng-option>
                            </ng-select>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 ">
                    <div class="row"><label class="col-md-5 col-form-label text-end">Phone Charges</label>
                        <div class="col-md-7">
                            <input type="text" class="form-control " placeholder="Phone Charges" formControlName="Monthly_Phone_Charges"/>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="row">
                        <label class="col-md-5 col-form-label text-end">Default Charges</label>
                        <div class="col-md-7">
                            <input type="text" class="form-control " placeholder="Default Charges" formControlName="Default_Charge"/>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4 ">
                    <div class="row"><label class="col-md-5 col-form-label text-end">Attachments</label>
                        <div class="col-md-7">
                            <input type="file" class="form-control " />
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
