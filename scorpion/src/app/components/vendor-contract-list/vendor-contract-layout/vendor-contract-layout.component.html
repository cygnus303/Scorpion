    <div class="step-container">

  <!-- Steps Header -->
  <div class="step-header d-flex justify-content-between align-items-center">

    <!-- Step 1 -->
    <div class="step-item d-flex align-items-center"
         [class.active]="selectedTab === 'profile'">

      <div class="step-circle">1</div>

      <div class="step-label"
           (click)="selectTab('profile')">
        Contract Profile
      </div>

    </div>

    <!-- Step 2 -->
    <div class="step-item d-flex align-items-center"
         [class.active]="selectedTab === 'charges'">

      <div class="step-circle">2</div>

      <div class="step-label"
           (click)="selectTab('charges')">
        Contract Charges Details
      </div>

    </div>

  </div>

  <!-- Progress Bar -->
  <div class="step-progress">
    <div class="step-progress-bar"
         [style.width]="selectedTab === 'profile' ? '50%' : '100%'">
    </div>
  </div>

</div>


<!-- Tab Content -->
<div class="p-3">

  <app-vendor-contract-profile
    *ngIf="selectedTab === 'profile'">
  </app-vendor-contract-profile>

  <app-vendor-contract-charges
    *ngIf="selectedTab === 'charges'">
  </app-vendor-contract-charges>

</div>
