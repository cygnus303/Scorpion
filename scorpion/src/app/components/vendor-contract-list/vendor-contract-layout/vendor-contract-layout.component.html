<div class="cnote-entry-container px-1 mb-3">
  <div class="text-white px-3 py-3 d-flex align-items-center justify-content-between fw-semibold background-color">
    <div class="mb-0">
      <i class="fas fa-edit me-2"></i>Vendor Contract - Step 1 of 2
    </div>
    <button class="btn btn-light" (click)="goBack()"> ← Back to Vendor Criteria</button>
  </div>
</div>

<ul class="nav nav-tabs px-3 pt-3">
  <li class="nav-item">
    <button class="nav-link fw-semibold larger-font" style="width: 250px;" [class.active]="selectedTab === 'profile'" (click)="selectTab('profile')">
      Contract Profile
    </button>
  </li>
  <li class="nav-item">
    <button class="nav-link fw-semibold larger-font" style="width: 250px;" [class.active]="selectedTab === 'charges'" (click)="selectTab('charges')">
      Contract Charges Detail
    </button>
  </li>
</ul>

<div>
  <!-- Contract Profile Section -->
  <div *ngIf="selectedTab === 'profile'">
    <app-vendor-contract-profile></app-vendor-contract-profile>
  </div>

  <!-- Contract Charges Detail Section -->
  <div *ngIf="selectedTab === 'charges'">
    <app-vendor-contract-charges></app-vendor-contract-charges>
  </div>
</div>
