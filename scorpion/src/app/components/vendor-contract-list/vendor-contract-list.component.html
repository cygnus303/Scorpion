<div class="cnote-entry-container px-1">
    <div class="text-white px-3 py-3 d-flex align-items-center justify-content-between fw-semibold background-color">
        <div>
            <i class="fas fa-list me-2"></i>
            Vendor Criteria
        </div>
    </div>
    <div class="form-grid p-4">
        <form>
            <div class="row">
                <div class="col-md-3 form-column ">
                    <div class="form-group">
                        <label class="col-md-5">Vendor Type</label>
                        <div class="col-md-7">
                            <div>
                                <ng-select class="noFoundTextColor required2"></ng-select>

                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 form-column ">
                    <div class="form-group">
                        <label class="col-md-5">Contract Type</label>
                        <div class="col-md-7">
                            <div class="radio-group ">
                                <ng-select class="noFoundTextColor required2"></ng-select>

                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 form-column ">
                    <div class="form-group">
                        <label class="col-md-5">Contract For</label>
                        <div class="col-md-7">
                            <div>
                                <ng-select class="noFoundTextColor required2"></ng-select>


                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 form-column ">
                    <div class="form-group">
                        <label class="col-md-5">Vendor</label>
                        <div class="col-md-7">
                            <div>
                                <ng-select class="noFoundTextColor required2"></ng-select>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div class="d-flex justify-content-center bg-secondary-subtle p-4 gap-2 mt-4">
    <button class="btn btn-secondary" (click)="goToBackList()">
        Add vendor Contract
    </button>
    <button class="btn btn-success"> <i class="fas fa-check"></i> Get Vendor Contract List</button>
</div>

<div class="cnote-entry-container px-2 mt-5">
    <div class="text-white px-3 py-3 d-flex align-items-center justify-content-between fw-semibold background-color">
        <div class="mb-0">
            <i class="fas fa-list me-2"></i> Detail Of Vendor Contract
        </div>
    </div>
    <div class="row p-2">
        <div class="col-md-1">
            <ng-select class="clear-icon" [items]="paginationService.recordOptions" bindLabel="label" bindValue="value" [(ngModel)]="paginationService.selectedRecordCount"
               ></ng-select>
        </div>
        <div class="col-md-2 col-form-label text-start">Records</div>
        <div class="col-md-5"></div>
        <div class="col-md-2 col-form-label text-end">Search</div>
        <div class="col-md-2">
            <input class="form-control">
        </div>
    </div>
    <div class="table-responsive p-4">
        <table class="table table-bordered table-hover align-middle mb-0">
            <thead class="table-light text-center">
                <tr>
                    <th  class="cursor-pointer">
                        ACTION
                    </th>

                    <th  class="cursor-pointer">
                        ContractID
                    </th>

                    <th  class="cursor-pointer">
                        Vendor Type
                    </th>

                    <th  class="cursor-pointer">
                        Start Date
                    </th>

                    <th  class="cursor-pointer">
                        End Date
                    </th>

                    <th  class="cursor-pointer">
                        Effective Date
                    </th>

                    <th  class="cursor-pointer">
                        Status 
                    </th>
                    <th  class="cursor-pointer">
                        Copy Contract  
                    </th>
                     <th  class="cursor-pointer">
                        View/Print 
                    </th>
                    <th  class="cursor-pointer">
                        Document
                    </th>
                </tr>
            </thead>
            <tbody>
                <!-- <tr >
                   <td colspan="8" class="text-center p-3">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </td>
                </tr>
                <tr >
                    <td colspan="8" class="text-center text-muted p-3">
                            No Record Found.
                        </td>
                </tr> -->
                <tr >
                    <td class="text-center">archi</td>
                    <td>archi</td>
                    <td>archi</td>
                    <td>archi</td>
                    <td>archi</td>
                    <td class="text-center">archi</td>
                    <td class="text-center">archi</td>
                    <td class="text-center">archi</td>
                    <td class="text-center">archi</td>
                    <td class="text-center">archi</td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="d-flex justify-content-between align-items-center px-4 pb-3">

        <div>
            Showing 0
            to 0
            of 10 entries
        </div>

        <div class="d-flex justify-content-center">

            <button class="btn btn-light border me-1" >
                ‹
            </button>

            <button  class="btn border me-1">
            </button>

            <button class="btn btn-light border" >
                ›
            </button>

        </div>

    </div>


</div>
