<ng-template #Templatepod>
    <div class="text-white px-3 py-3 d-flex align-items-center fw-semibold background-color">
        <i class="fas fa-truck-loading me-2"></i> PRS Arrival Details
        <i class="fas fa-times ms-auto cursor-pointer" (click)="modalRef.hide()"></i>
    </div>

    <div class="modal-body p-3 bg-white">
        <div class="control-bar d-block gap-2">
            <div class="row">
                <div class="col-md-3 d-print-inline-block align-content-end">
                    <div class="d-flex gap-2">
                        <label class=" form-label meta-label d-flex align-items-center gap-2">
                            PFM Number :
                        </label>
                        <div class="fw-bold text-primary" style="word-break: break-all;">
                            {{arrivalData.pdcno || '---'}}
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group-input">
                        <ng-select [items]="generalMasterService.loadingData" bindLabel="codeDesc" bindValue="codeId"
                            [(ngModel)]="arrivalData.loadBy" (change)="onLoadingByChange()"
                            placeholder="Select Loading By" [clearable]="false">
                        </ng-select>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group-input">
                        <ng-select [items]="generalMasterService.chargeTypeData" bindLabel="codeDesc" bindValue="codeId"
                            [(ngModel)]="arrivalData.chargeType" (change)="triggerRefresh()"
                            placeholder="Select Charge Type" [clearable]="false"
                            [readonly]="arrivalData.loadBy === 'XX5' || arrivalData.loadBy === 'XX9'">
                        </ng-select>
                    </div>
                </div>
            </div>
        </div>
        <div style="min-height: 500px;">
            <!-- Content Area -->
            <div class="p-0"
                *ngIf="arrivalData.loadBy && (arrivalData.chargeType || arrivalData.loadBy === 'XX5' || arrivalData.loadBy === 'XX9')">
                <app-prs-arrival-details [arrivalData]="arrivalData"
                    (dataEmitter)="onDataSubmit($event)"></app-prs-arrival-details>
            </div>

            <!-- Empty State Prompt -->
            <div class="p-5 text-center text-muted d-flex align-items-center justify-content-center"
                *ngIf="!arrivalData.loadBy || (!arrivalData.chargeType && arrivalData.loadBy !== 'XX5' && arrivalData.loadBy !== 'XX9')"
                style="min-height: 500px;">
                <div class="py-5">
                    <i class="fas fa-hand-pointer fa-3x mb-3 opacity-25"></i>
                    <p>Please select <b>Loading By</b> and <b>Charge Type</b> to view arrival details.</p>
                </div>
            </div>
        </div>
    </div>
</ng-template>
