<ng-template #Templatepod>
    <!-- Header -->
    <div class="modal-header text-white" style="background: linear-gradient(135deg, #0d47a1 0%, #08306b 100%);">
        <h5 class="modal-title mb-0 d-flex align-items-center" style="font-size: 16px; font-weight: 700;">
            <i class="fas fa-file-invoice-dollar me-2" style="font-size: 14px;"></i> THC Financial Details
        </h5>
        <button type="button" class="btn-close btn-close-white" style="filter: invert(1);" aria-label="Close" (click)="modalRef.hide()"></button>
    </div>
    
    <form>
        <div class="modal-body bg-light" style="padding: 16px 20px;">
            
            <!-- Basic Details -->
            <div class="card mb-3 shadow-sm" style="border: 1px solid #e3e7ee; border-radius: 8px;">
                <div class="card-header py-2" style="background: #f1f5fb; color: #0d47a1; font-size: 13px; font-weight: 700; border-bottom: 1px solid #e3e7ee;">
                    <i class="fas fa-info-circle me-1"></i> Basic Information
                </div>
                <div class="card-body py-3 px-4">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label text-muted text-uppercase mb-1" style="font-size: 11px; font-weight: 700; letter-spacing: 0.02em;">THC Number</label>
                            <input type="text" class="form-control form-control-sm" readonly [value]="selectedTHC || '—'" />
                        </div>
                        <div class="col-md-3">
                            <label class="form-label text-muted text-uppercase mb-1" style="font-size: 11px; font-weight: 700; letter-spacing: 0.02em;">Contract Type</label>
                            <input type="text" class="form-control form-control-sm" readonly [value]="thcData?.conttyP_Name || '--'" />
                        </div>
                    </div>
                </div>
            </div>

            <!-- Payment Details -->
            <div class="card shadow-sm mb-0" style="border: 1px solid #e3e7ee; border-radius: 8px;">
                <div class="card-header py-2" style="background: #f1f5fb; color: #0d47a1; font-size: 13px; font-weight: 700; border-bottom: 1px solid #e3e7ee;">
                    <i class="fas fa-list me-1"></i> Payment Details
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-bordered mb-0">
                            <thead class="bg-light">
                                <tr>
                                    <th class="text-center align-middle" style="width: 20%; font-size: 12px; color: #495057;">Contract Amt.</th>
                                    <th class="text-center align-middle" style="width: 20%; font-size: 12px; color: #495057;">Standard Cont. Amt.</th>
                                    <th class="text-center align-middle" style="width: 20%; font-size: 12px; color: #495057;">Advance Amount</th>
                                    <th class="text-center align-middle" style="width: 20%; font-size: 12px; color: #495057;">Advance Amount Paid At</th>
                                    <th class="text-center align-middle" style="width: 20%; font-size: 12px; color: #495057;">Balance Amount Paid At</th>
                                </tr>
                            </thead>
                            <tbody *ngIf="thcData">
                                <tr>
                                    <td class="p-2 align-middle">
                                        <input type="text" class="form-control form-control-sm text-center" name="pcamt" [(ngModel)]="thcData.pcamt" oninput="this.value = this.value.replace(/[^0-9.]/g,'');">
                                    </td>
                                    <td class="p-2 align-middle">
                                        <input type="text" class="form-control form-control-sm text-center" name="stdAmt" [(ngModel)]="thcData.stdAmt" oninput="this.value = this.value.replace(/[^0-9.]/g,'');">
                                    </td>
                                    <td class="p-2 align-middle">
                                        <input type="text" class="form-control form-control-sm text-center" name="advamt" [(ngModel)]="thcData.advamt" oninput="this.value = this.value.replace(/[^0-9.]/g,'');">
                                    </td>
                                    <td class="p-2 align-middle">
                                        <input type="text" class="form-control form-control-sm text-center" name="fincmplbr" [(ngModel)]="thcData.fincmplbr">
                                    </td>
                                    <td class="p-2 align-middle">
                                        <input type="text" class="form-control form-control-sm text-center" name="balamtbrcd" [(ngModel)]="thcData.balamtbrcd">
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
        
        <!-- Footer -->
        <div class="d-flex justify-content-end p-3" style="background: #fafbfc; border-top: 1px solid #e3e7ee; gap: 10px;">
            <button type="button" class="btn btn-outline-danger fw-bold" style="font-size: 13px; padding: 6px 20px; margin-right: 8px;" (click)="modalRef.hide()">Cancel</button>
            <button type="button" class="btn btn-success fw-bold text-white" style="font-size: 13px; padding: 6px 22px; background-color: #2e7d32; border-color: #2e7d32;" (click)="submitTHC()">Submit</button>
        </div>
    </form>
</ng-template>
