<div class="cnote-entry-container">
    <div class="text-white px-3 py-3 d-flex align-items-center fw-semibold background-color">
        <i class="fas fa-filter me-2"></i>
        Update DRS Header Information
    </div>
        <form [formGroup]="DRSSummaryForm">
    <div class="form-grid p-4">
        <div class="row pb-3">
            <div class="col-4">
                <div class="row align-items-center">
                    <label class="col-sm-5 col-form-label text-end">DRS No :</label>
                    <div class="col-sm-7 text-start fw-bold">
                        DS/PIM/2526/006217
                    </div>
                </div>
            </div>
            <div class="col-4">
                <div class="row align-items-center">
                    <label class="col-sm-5 col-form-label text-end">Delivered By :</label>
                    <div class="col-sm-7 text-start fw-bold">
                        Staff - V13499: TRUPTI TEMPO SERVICE
                    </div>
                </div>
            </div>
            <div class="col-4">
                <div class="row align-items-center">
                    <label class="col-sm-5 col-form-label text-end">DRS Date :</label>
                    <div class="col-sm-7 text-start fw-bold">
                        17-12-2025 11:11:00 AM
                    </div>
                </div>
            </div>
        </div>
         <div class="row pb-3">
            <div class="col-4">
                <div class="row align-items-center">
                    <label class="col-sm-5 col-form-label text-end">Start/Close KM :</label>
                    <div class="col-sm-7 text-start fw-bold">
                       <input class="form-control" type="text" >
                    </div>
                </div>
            </div>
            <div class="col-4">
                <div class="row align-items-center">
                    <label class="col-sm-5 col-form-label text-end">Driver Name :</label>
                    <div class="col-sm-7 text-start fw-bold">
                        of Vehicle  MH04MR6317  Carrying  1  Consignment(s)
                    </div>
                </div>
            </div>
        </div>
         <h3 class="pb-4 text-start appointment mt-2">Unloading Charge</h3>
          <div class="row pb-3 pt-2">
            <div class="col-3">
                <div class="row align-items-center">
                    <label class="col-sm-5 col-form-label text-end">Unloader By:</label>
                    <div class="col-sm-7 text-start fw-bold">
                      <input class="form-control required2" placeholder="Unloader By" type="text" formControlName="LoadingBy">
                    </div>
                </div>
            </div>
           <div class="col-3">
                <div class="row align-items-center">
                    <label class="col-sm-5 col-form-label text-end">Vendor Code :</label>
                    <div class="col-sm-7 text-start fw-bold">
                      <ng-select class="noFoundTextColor required2 clear-icon" placeholder="Vendor Code" formControlName="VendorCode" 
                             [items]="challanService.branchWiseLoadingUnloadingList" bindLabel="text" bindValue="value" appFocusNext (change)="getLoadingCharge($event?.value)"
                             [ngClass]="{ 'border-danger': DRSSummaryForm.get('VendorCode')?.invalid  && DRSSummaryForm.get('VendorCode')?.touched }"></ng-select>
                    </div>
                </div>
            </div>
            <div class="col-3">
                <div class="row align-items-center">
                    <label class="col-sm-5 col-form-label text-end">Rate :</label>
                    <div class="col-sm-7 text-start fw-bold">
                      <input class="form-control required2" placeholder="Rate" type="text" formControlName="Rate">
                    </div>
                </div>
            </div>
            <div class="col-3">
                <div class="row align-items-center">
                    <label class="col-sm-5 col-form-label text-end">UnLoading Charge:</label>
                    <div class="col-sm-7 text-start fw-bold">
                      <input class="form-control required2" placeholder="UnLoading Charge" type="text" formControlName="LoadingCharge">
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>
</div>
