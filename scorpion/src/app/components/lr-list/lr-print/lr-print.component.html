<ng-template #lrPrintModal>
    <!-- Header -->
    <div class="modal-header border-0 lr-header d-flex align-items-center">
        <div class="d-flex align-items-center w-100 position-relative">
            <div class="me-2 d-flex align-items-center justify-content-center" style="margin-top: -16px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                  <path d="M5 1a2 2 0 0 0-2 2v1h10V3a2 2 0 0 0-2-2H5zm6 8H5a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-3a1 1 0 0 0-1-1z"/>
                  <path d="M0 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-1v-2a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v2H2a2 2 0 0 1-2-2V7zm2.5 1a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1z"/>
                </svg>
            </div>
            <div class="flex-grow-1">
                <h4 class="m-0" style="font-size: 16px; font-weight: 700; letter-spacing: 0.2px;">LR Print Format</h4>
                <div style="font-size: 12px; color: #a9b3c9; margin-top: 2px;">
                    {{ data?.dockno ? 'LR-' + data.dockno : 'LR-XXXX-XXXXX' }}
                </div>
            </div>
            <div class="lr-close-btn position-absolute" style="right: 0;" (click)="closeModal()">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </div>
        </div>
    </div>

    <!-- Body -->
    <div class="modal-body p-4" style="background-color: #ffffff;">
        <p class="mb-3" style="font-size: 13px; color: #6b7280; font-weight: 500;">
            Choose a format to download the consignment note for this LR.
        </p>

        <!-- Standard Format -->
        <div class="format-card" [class.selected]="selectedFormat === 'standard'" (click)="selectFormat('standard')">
            <div class="custom-radio">
                <div class="custom-radio-inner"></div>
            </div>
            <div>
                <div class="format-title">Standard</div>
                <div class="format-subtitle">Default consignment note format</div>
            </div>
        </div>

        <!-- Alkem Custom Format -->
        <div class="format-card mb-0" [class.selected]="selectedFormat === 'alkem'" (click)="selectFormat('alkem')">
            <div class="custom-radio">
                <div class="custom-radio-inner"></div>
            </div>
            <div>
                <div class="format-title">Alkem Custom</div>
                <div class="format-subtitle">Adds consignee pincode, division & packaging type</div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="modal-footer p-3 px-4 justify-content-end" style="background-color: #f8fafc; border-top: 1px solid #e5e5e5;">
        <button type="button" class="btn btn-cancel-outline" (click)="closeModal()">Cancel</button>
    </div>
</ng-template>
